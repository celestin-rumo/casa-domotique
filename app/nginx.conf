server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Une app à écran unique : toute adresse revient à index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le jeton est dans le bundle : il ne doit pas traîner dans un cache.
    # Les assets, eux, portent un hash dans leur nom et peuvent vivre longtemps.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /sw.js      { add_header Cache-Control "no-store"; }
    location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
