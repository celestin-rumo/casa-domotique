# Faire tourner la maison sans la maison : Home Assistant et Music Assistant
# sur le poste de dev, sans Raspberry Pi, sans ampoule et sans enceinte.
#
#   docker compose -f docker-compose.dev.yml up
#   → http://localhost:8123  (créer un compte au premier démarrage)
#
# Le dossier homeassistant/ du dépôt est monté en LECTURE SEULE sur
# /config/casa : Home Assistant écrit sa base et ses secrets dans un volume
# à lui, jamais dans le dépôt.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: casa-hass
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Zurich
    volumes:
      - hass-config:/config
      - ./homeassistant:/config/casa:ro
      - ./dev/configuration.yaml:/config/configuration.yaml:ro
      # Les phrases d'Assist ne sont lues QUE dans /config/custom_sentences :
      # le dossier du dépôt y est monté à part, puisque le reste vit sous
      # /config/casa.
      - ./homeassistant/custom_sentences:/config/custom_sentences:ro
    restart: unless-stopped

  # --- la voix : trois services Wyoming, parlés par Home Assistant seul ---
  # Aucun port publié : Home Assistant les joint par leur nom de service sur
  # le réseau du compose (whisper:10300, piper:10200, openwakeword:10400),
  # et un satellite (Voice PE, ESP32) ne parle qu'à Home Assistant, jamais
  # à eux. Comme Music Assistant, leur intégration — Wyoming Protocol — ne
  # se configure que par l'interface (docs/TESTING.md, 1.9).

  # Reconnaissance de la parole. small-int8 comprend bien le français sur
  # un portable ; sur un Pi 4, passer à base-int8 ou tiny-int8 — moins
  # précis, mais une phrase transcrite en deux secondes plutôt que vingt.
  whisper:
    image: rhasspy/wyoming-whisper
    container_name: casa-whisper
    command: --model small-int8 --language fr
    volumes:
      - whisper-data:/data
    restart: unless-stopped

  # La reconnaissance du Pi : Speech-to-Phrase ne transcrit que les phrases
  # que Home Assistant connaît — les ordres intégrés sur les entités
  # exposées, et celles de homeassistant/custom_sentences/, qu'il lit dans
  # le même format — d'où une réponse en moins d'une seconde là où whisper
  # met dix secondes sur un Pi. Il s'entraîne au démarrage en interrogeant
  # Home Assistant : il lui faut le jeton de app/.env (env_file), et Home
  # Assistant déjà debout.
  #
  # Les deux moteurs tournent côte à côte ; c'est l'assistant vocal, dans
  # Home Assistant, qui dit lequel écoute (docs/TESTING.md, 1.9).
  speech-to-phrase:
    image: rhasspy/wyoming-speech-to-phrase
    container_name: casa-parole
    env_file:
      - path: app/.env
        required: false
    # /run.sh est l'entrée de l'image ; on la garde et on n'ajoute que nos
    # options, le jeton lu dans l'environnement plutôt qu'écrit ici.
    entrypoint: ["bash", "-c"]
    command:
      - >-
        exec /run.sh
        --hass-websocket-uri ws://homeassistant:8123/api/websocket
        --hass-token "$$VITE_HA_TOKEN"
        --custom-sentences-dir /custom_sentences
        --retrain-on-start
    volumes:
      - parole-models:/models
      - parole-train:/train
      - ./homeassistant/custom_sentences:/custom_sentences:ro
    depends_on:
      - homeassistant
    restart: unless-stopped

  # Synthèse de la réponse. Une voix française ; le modèle se télécharge au
  # premier démarrage.
  piper:
    image: rhasspy/wyoming-piper
    container_name: casa-piper
    command: --voice fr_FR-siwis-medium
    volumes:
      - piper-data:/data
    restart: unless-stopped

  # Le mot d'appel, pour un satellite qui n'en détecte pas lui-même. Le
  # navigateur n'en a pas besoin : dans l'interface, on clique le micro.
  openwakeword:
    image: rhasspy/wyoming-openwakeword
    container_name: casa-wakeword
    command: --preload-model ok_nabu
    restart: unless-stopped

  # Music Assistant tourne aussi bien sur un portable que sur un Pi.
  # Son intégration Home Assistant ne se configure QUE par l'interface — elle
  # n'a pas de forme YAML, donc elle ne peut pas vivre dans ce dépôt :
  # Paramètres > Appareils et services > Ajouter > Music Assistant,
  # serveur http://IP-du-poste:8095 — pas le nom du service : depuis 2.10,
  # l'intégration ouvre la page de connexion de Music Assistant dans le
  # navigateur, qui ne connaît pas ce nom (voir docs/TESTING.md, 1.6).
  #
  # dev/music est monté comme bibliothèque locale : de quoi entendre quelque
  # chose sans compte Spotify.
  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: casa-music
    ports:
      - "8095:8095"
    volumes:
      - music-data:/data
      - ./dev/music:/media:ro
    # La découverte réseau (Sonos, Chromecast) a besoin du réseau de l'hôte.
    # Inutile pour le lecteur intégré du navigateur ; à décommenter le jour où
    # de vraies enceintes doivent être trouvées, sous Linux uniquement — et
    # alors Home Assistant joint Music Assistant sur http://localhost:8095.
    # network_mode: host
    restart: unless-stopped

  # L'app comme un site, sur :8088 — le natel l'ouvre et l'épingle à l'écran
  # d'accueil. Le conteneur construit l'app lui-même : ni Node ni npm sur
  # le Pi. L'URL et le jeton sont figés au build, donc passés en arguments ;
  # docker compose les lit dans app/.env avec --env-file :
  #
  #   docker compose --env-file app/.env -f docker-compose.dev.yml up --build -d app
  #
  # VITE_HA_URL doit être l'adresse du Pi TELLE QUE LE NATEL LA VOIT
  # (http://192.168.x.x:8123), pas localhost — sur le natel, localhost c'est
  # le natel. Le jeton est dans les fichiers servis : quiconque ouvre la page
  # sur le Wi-Fi pilote la maison. Ne pas exposer ce port hors du réseau local.
  app:
    build:
      context: ./app
      args:
        VITE_HA_URL: ${VITE_HA_URL:-http://homeassistant.local:8123}
        VITE_HA_TOKEN: ${VITE_HA_TOKEN:-}
    container_name: casa-app
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  hass-config:
  music-data:
  whisper-data:
  piper-data:
  parole-models:
  parole-train:
