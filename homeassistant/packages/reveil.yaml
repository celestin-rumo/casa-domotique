# Le réveil, en un seul fichier : ses réglages, le script qui fait lever le
# jour, celui qui fait entrer la musique, l'automatisation qui les déclenche
# à l'heure dite, ce que fait « Je suis debout », et les phrases qu'Assist
# comprend.
#
# LE COUCHER DE SOLEIL VIT ICI AUSSI, en fin de chaque section : c'est le
# lever à l'envers, et il reprend sa courbe par ancres YAML — qui ne
# traversent pas les fichiers. Ses réglages sont les mêmes, préfixés
# coucher_ : durée, lumières, courbe, musique.
#
# C'est un « package » Home Assistant : chaque clé (input_datetime, script,
# automation…) est fusionnée avec celles de configuration.yaml. Tout ce qui
# concerne le réveil vit donc ici, et nulle part ailleurs.
#
# TOUS LES RÉGLAGES SONT DES HELPERS, ÉCRITS PAR L'APP, ET AUCUN N'A
# D'`initial:`. Ce n'est pas un oubli. Un helper qui porte `initial:` y
# revient à CHAQUE démarrage de Home Assistant, au lieu de reprendre sa
# dernière valeur : l'heure réglée à 6 h 30 depuis le natel redevenait 7 h
# au premier `git pull` suivi d'un redémarrage, sans que rien ne le signale.
# C'était le cas jusqu'au 11 septembre 2026. Sans `initial:`, Home Assistant
# restaure la valeur d'avant l'arrêt. La contrepartie ne joue qu'une fois,
# sur une installation neuve : chaque nombre part de son minimum, et les
# scripts remplacent les textes vides par leurs valeurs par défaut.

input_datetime:
  reveil_heure:
    name: Heure du réveil
    icon: mdi:alarm
    has_date: false
    has_time: true

input_boolean:
  reveil_actif:
    name: Réveil actif
    icon: mdi:alarm-check

input_number:
  reveil_duree:
    name: Durée du lever
    icon: mdi:weather-sunset-up
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    mode: slider
  # La musique : combien de minutes après le début du lever elle entre, et
  # le volume auquel elle commence puis finit — le second atteint à la fin
  # du lever. Les deux à 0 % veulent dire « jamais réglé » : le script prend
  # alors 3 % → 20 %, les valeurs d'avant ces réglages.
  reveil_musique_delai:
    name: Réveil · musique après
    icon: mdi:timer-music-outline
    min: 0
    max: 60
    step: 1
    unit_of_measurement: min
    mode: slider
  reveil_volume_debut:
    name: Réveil · volume de départ
    icon: mdi:volume-low
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
  reveil_volume_fin:
    name: Réveil · volume final
    icon: mdi:volume-high
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
  coucher_duree:
    name: Coucher · durée
    icon: mdi:weather-sunset-down
    min: 1
    max: 90
    step: 1
    unit_of_measurement: min
    mode: slider
  # Le volume d'où la musique descend. 0 : celui de l'enceinte au moment du
  # coucher — on part de ce qu'on entend.
  coucher_volume_debut:
    name: Coucher · volume de départ
    icon: mdi:volume-medium
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider

input_text:
  # Les lumières qui se lèvent, séparées par des virgules, chacune avec le
  # moment où elle entre — « light.chambre,light.chambre_wiz_1@26 » : la
  # lampe dès le début, la WiZ à 26 % du lever, puis les deux sur la même
  # courbe. Sans @, dès le début. Vide : light.chambre seule.
  reveil_lumieres:
    name: Réveil · lumières
    icon: mdi:lightbulb-group
    max: 255
  # La courbe du lever : des points « position,intensité,couleur » séparés
  # par des points-virgules, dans n'importe quel ordre —
  #   0,1,k2000;40,30,ff8a3c;100,80,k4000
  # La position est un pourcentage de la durée du lever : allonger le réveil
  # étire la courbe, sans rien régler d'autre. L'intensité est un
  # pourcentage. La couleur est un blanc en kelvins (k2000) ou une teinte en
  # hexadécimal (ff8a3c). Moins de deux points valables : la courbe par
  # défaut, braise à 1 % → jour à 78 %, celle d'avant ces réglages. L'app
  # (src/couleur.ts) lit ce texte de la même façon.
  reveil_courbe:
    name: Réveil · courbe
    icon: mdi:chart-bell-curve-cumulative
    max: 255
  # Ce que joue la musique : un nom de la table de script.play_playlist
  # (« Détente »), ou l'adresse d'une playlist de la bibliothèque de Music
  # Assistant (« library://playlist/83 »). « aucune » : pas de musique. Vide :
  # Détente, comme avant ces réglages.
  reveil_playlist:
    name: Réveil · playlist
    icon: mdi:playlist-music
    max: 255
  # Le coucher, au même format que le lever. Ses lumières : le moment après
  # @ est celui où la lampe S'ÉTEINT — « light.chambre_wiz_1@40 » s'éteint à
  # 40 % du coucher ; sans @, elle va jusqu'au bout. Vide : les lampes
  # allumées au moment du coucher.
  coucher_lumieres:
    name: Coucher · lumières
    icon: mdi:lightbulb-group-outline
    max: 255
  # Moins de deux points : 60 % à 2700 K, jusqu'à 1 % à 2000 K.
  coucher_courbe:
    name: Coucher · courbe
    icon: mdi:chart-bell-curve-cumulative
    max: 255
  # Vide : la musique qui joue déjà descend avec la lumière. Un nom ou une
  # adresse : cette playlist part au début du coucher. « aucune » : le
  # coucher ne touche pas à la musique.
  coucher_playlist:
    name: Coucher · playlist
    icon: mdi:playlist-music
    max: 255

# Le moment du bonjour : lancé avec le lever, pour sa durée, il sonne à la
# fin — script.reveil_bonjour donne alors l'heure, la météo, et dit de se
# lever. « Prolonger » (l'app, ou « encore cinq minutes ») le repousse, et
# le relance s'il a déjà sonné : c'est le rappel. « Je suis debout »
# l'annule. Un minuteur plutôt qu'une attente dans script.reveil, parce
# qu'une attente ne se repousse pas, et qu'il survit à un redémarrage.
timer:
  reveil_bonjour:
    name: Réveil · bonjour
    icon: mdi:account-voice
    restore: true
  # La fin du coucher, pour que l'app la montre : lancé avec lui, annulé
  # par « arrête le coucher ».
  coucher:
    name: Coucher · fin
    icon: mdi:weather-sunset-down
    restore: true

input_select:
  # Ce que fait « Je suis debout », une fois le lever et la musique coupés.
  # Les options sont des entity_id : l'app les nomme (APRES_REVEIL dans
  # config.ts, même ordre), le script les lance. « rien » laisse la pièce
  # comme le lever l'a mise — le comportement d'avant ce réglage.
  reveil_debout:
    name: Réveil · au lever
    icon: mdi:human-greeting
    options:
      - rien
      - scene.reveil_debout
      - script.mood_detente
      - script.mood_focus
      - script.mood_chillos
      - script.mood_calin
      # Les ambiances ajoutées depuis l'app ; l'app ne propose que les
      # places remplies.
      - script.mood_perso_1
      - script.mood_perso_2
      - script.mood_perso_3
      - script.mood_perso_4
      - script.mood_perso_5
      - script.mood_perso_6

automation:
  - id: reveil_a_l_heure
    alias: Réveil → lever de soleil
    description: À l'heure du réveil, si le réveil est actif, lance script.reveil.
    trigger:
      # Un input_datetime sans date sonne chaque jour à la même heure.
      - platform: time
        at: input_datetime.reveil_heure
    condition:
      - condition: state
        entity_id: input_boolean.reveil_actif
        state: "on"
    action:
      - service: script.reveil

  - id: reveil_bonjour
    alias: Réveil → bonjour
    description: À la fin du lever, prolongations comprises, dit bonjour.
    trigger:
      - platform: event
        event_type: timer.finished
        event_data: { entity_id: timer.reveil_bonjour }
    action:
      - service: script.reveil_bonjour

script:
  # Le lever de soleil, lu dans les helpers : les lumières de
  # input_text.reveil_lumieres suivent la courbe de input_text.reveil_courbe
  # sur input_number.reveil_duree minutes, chacune à partir de son moment
  # d'entrée. Avant ce moment, une lampe n'est pas touchée ; au moment venu,
  # elle s'allume en fondu, sur les 30 s de la marche, jusqu'à là où en est
  # la courbe, puis monte avec les autres.
  #
  # Le Pi avance par marches de 30 s et demande à chaque lampe une transition
  # de 30 s vers la marche suivante. Sur une Hue, on ne voit aucun saut. Les
  # WiZ ne savent pas les transitions : elles font un petit pas toutes les
  # 30 s, ce qui reste doux parce que la marche est petite. C'est la raison de
  # ne pas confier chaque segment de la courbe à une seule longue transition,
  # que les WiZ franchiraient d'un bond.
  #
  # Entre deux points, l'intensité et la couleur sont interpolées. Deux blancs
  # donnent des kelvins, que la lampe rend comme un vrai blanc. Dès qu'une
  # teinte est en jeu, le segment passe en RVB, les blancs y étant convertis
  # par l'approximation de Tanner Helland — calculée une fois, à la lecture
  # de la courbe, pas à chaque marche.
  #
  # La musique n'est PAS dans ce script : elle est confiée à
  # script.reveil_musique par un script.turn_on, qui n'attend pas et dont les
  # erreurs ne remontent pas ici. Sans enceinte, la lumière se lève quand
  # même. C'est le contraire des ambiances, où le son qui échoue empêche
  # l'écho — un réveil qui n'allume pas parce que Spotify ne répond pas ferait
  # rater le train.
  reveil:
    alias: Réveil
    icon: mdi:weather-sunset-up
    mode: restart
    fields:
      duree:
        description: Minutes du lever. Par défaut, input_number.reveil_duree.
        example: 20
    variables:
      # LA COURBE EST PARTAGÉE AVEC LE COUCHER (script.coucher, plus bas) :
      # mêmes gabarits, repris par ancre YAML, qui ne lisent que ces quatre
      # variables. `sens` change une seule chose, le moment d'une lampe :
      # celui où elle ENTRE au lever, celui où elle S'ÉTEINT au coucher.
      sens: lever
      source_lumieres: input_text.reveil_lumieres
      source_courbe: input_text.reveil_courbe
      lampes_defaut: [{ id: light.chambre, p: 0 }]
      courbe_defaut: ["0,1,k2000", "100,78,k4000"]
      minutes: "{{ [duree | default(states('input_number.reveil_duree')) | int(20), 1] | max }}"
      # [{'id': 'light.chambre', 'p': 0}, {'id': 'light.chambre_wiz_1', 'p': 26}]
      lampes: &courbe_lampes >-
        {%- set ns = namespace(l=[]) -%}
        {%- for m in states(source_lumieres).split(',') -%}
          {%- set x = m.split('@') | map('trim') | list -%}
          {%- if x[0] is match('light[.]') -%}
            {%- set p = x[1] | float(0) if x | count > 1 else 0 -%}
            {%- set ns.l = ns.l + [{'id': x[0], 'p': [[p, 0] | max, 100] | min}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.l if ns.l else lampes_defaut -}}
      points: &courbe_points >-
        {%- set brut = states(source_courbe) | lower -%}
        {%- set motif = '^[ ]*[0-9.]+[ ]*,[ ]*[0-9.]+[ ]*,[ ]*(k[0-9]{4,5}|[0-9a-f]{6})[ ]*$' -%}
        {%- set valides = brut.split(';') | select('match', motif) | list -%}
        {%- set morceaux = valides if valides | count >= 2 else courbe_defaut -%}
        {%- set ns = namespace(l=[]) -%}
        {%- for m in morceaux -%}
          {%- set x = m.split(',') | map('trim') | list -%}
          {%- set c = x[2] -%}
          {%- if c[0] == 'k' -%}
            {%- set k = c[1:] | int -%}
            {%- set t = k / 100 -%}
            {%- set r = 255 if t <= 66 else 329.698727446 * (t - 60) ** -0.1332047592 -%}
            {%- set g = 99.4708025861 * log(t) - 161.1195681661 if t <= 66
                  else 288.1221695283 * (t - 60) ** -0.0755148492 -%}
            {%- set b = 255 if t >= 66 else 0 if t <= 19
                  else 138.5177312231 * log(t - 10) - 305.0447927307 -%}
          {%- else -%}
            {%- set k = none -%}
            {%- set r = c[0:2] | int(0, 16) -%}
            {%- set g = c[2:4] | int(0, 16) -%}
            {%- set b = c[4:6] | int(0, 16) -%}
          {%- endif -%}
          {%- set ns.l = ns.l + [{
                'p': [[x[0] | float(0), 0] | max, 100] | min,
                'b': [[x[1] | float(0), 0] | max, 100] | min,
                'k': k,
                'rgb': [r, g, b] | map('round') | map('int') | list }] -%}
        {%- endfor -%}
        {{- ns.l | sort(attribute='p') -}}
      pas_s: 30
      # Au moins deux marches, même pour une minute : une seule serait un
      # allumage sec, pas un lever.
      marches: &courbe_marches "{{ [(minutes * 60 / pas_s) | round(0, 'ceil') | int, 2] | max }}"
      # La musique entre au même moment RELATIF du lever, vrai réveil ou
      # essai d'une minute : l'essai reste une miniature fidèle du matin.
      duree_reglee: "{{ [states('input_number.reveil_duree') | float(20), 1] | max }}"
      delai_min: "{{ states('input_number.reveil_musique_delai') | float(10) }}"
      attente_s: "{{ (([delai_min / duree_reglee, 1] | min) * minutes * 60) | int }}"
      montee_s: "{{ [minutes * 60 - attente_s, 60] | max | int }}"
    sequence:
      # Le bonjour, à la fin du lever : l'essai d'une minute dit donc bonjour
      # au bout d'une minute, comme une miniature du matin.
      - service: timer.start
        target: { entity_id: timer.reveil_bonjour }
        data:
          duration: "{{ '%02d:%02d:00' | format(minutes // 60, minutes % 60) }}"
      - service: script.turn_on
        target: { entity_id: script.reveil_musique }
        data:
          variables:
            attente_s: "{{ attente_s }}"
            montee_s: "{{ montee_s }}"
      # marches + 1 ordres : le premier pose le point de départ, le dernier
      # atteint la fin de la courbe.
      - &courbe_deroulee
        repeat:
          count: "{{ marches + 1 }}"
          sequence:
            - variables:
                # Où en est la courbe, en pourcentage. Au lever, les lampes
                # actives sont celles dont le moment est venu ; au coucher,
                # celles dont le moment n'est pas encore passé — 0 voulant
                # dire « jusqu'à la fin ».
                pr: "{{ (repeat.index - 1) / marches * 100 }}"
                parties: >-
                  {{ [] if sens == 'lever' else lampes | selectattr('p', 'gt', 0)
                     | selectattr('p', 'le', pr | float) | map(attribute='id') | list }}
                actives: >-
                  {%- if sens == 'lever' -%}
                    {{ lampes | selectattr('p', 'le', pr | float) | map(attribute='id') | list }}
                  {%- else -%}
                    {{ lampes | map(attribute='id') | reject('in', parties) | list }}
                  {%- endif -%}
                etape: >-
                  {%- set ns = namespace(a=points[0], b=points[-1]) -%}
                  {%- for pt in points -%}
                    {%- if pt.p <= pr -%}{%- set ns.a = pt -%}{%- endif -%}
                  {%- endfor -%}
                  {%- for pt in points | reverse -%}
                    {%- if pt.p >= pr -%}{%- set ns.b = pt -%}{%- endif -%}
                  {%- endfor -%}
                  {%- set t = 0 if ns.b.p <= ns.a.p else (pr - ns.a.p) / (ns.b.p - ns.a.p) -%}
                  {%- set lum = (ns.a.b + (ns.b.b - ns.a.b) * t) | round(1) -%}
                  {%- if ns.a.k is not none and ns.b.k is not none -%}
                    {{- {'b': lum, 'k': (ns.a.k + (ns.b.k - ns.a.k) * t) | round(0) | int, 'rgb': none} -}}
                  {%- else -%}
                    {{- {'b': lum, 'k': none, 'rgb': [
                          (ns.a.rgb[0] + (ns.b.rgb[0] - ns.a.rgb[0]) * t) | round(0) | int,
                          (ns.a.rgb[1] + (ns.b.rgb[1] - ns.a.rgb[1]) * t) | round(0) | int,
                          (ns.a.rgb[2] + (ns.b.rgb[2] - ns.a.rgb[2]) * t) | round(0) | int]} -}}
                  {%- endif -%}
            # Au coucher, une lampe dont le moment est passé s'éteint en
            # fondu. Redemandé à chaque marche : une lampe déjà éteinte ne
            # bouge pas.
            - if:
                - condition: template
                  value_template: "{{ parties | count > 0 }}"
              then:
                - service: light.turn_off
                  target: { entity_id: "{{ parties }}" }
                  data: { transition: "{{ pas_s }}" }
            # Aucune lampe encore entrée : la marche passe sans rien allumer.
            - if:
                - condition: template
                  value_template: "{{ actives | count > 0 }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ etape.k is not none }}"
                  then:
                    - service: light.turn_on
                      target: { entity_id: "{{ actives }}" }
                      data:
                        brightness_pct: "{{ etape.b }}"
                        color_temp_kelvin: "{{ etape.k }}"
                        transition: "{{ pas_s }}"
                  else:
                    - service: light.turn_on
                      target: { entity_id: "{{ actives }}" }
                      data:
                        brightness_pct: "{{ etape.b }}"
                        rgb_color: "{{ etape.rgb }}"
                        transition: "{{ pas_s }}"
            - if:
                - condition: template
                  value_template: "{{ repeat.index <= marches }}"
              then:
                - delay:
                    seconds: "{{ pas_s }}"

  # La musique du matin : elle entre après attente_s, au volume de départ,
  # puis monte jusqu'au volume final sur montee_s. Ce qu'elle joue vient de
  # input_text.reveil_playlist : un nom de la table de script.play_playlist,
  # ou une adresse de la bibliothèque de Music Assistant, jouée telle quelle.
  reveil_musique:
    alias: Réveil · musique
    icon: mdi:music-note
    mode: restart
    fields:
      player: { example: media_player.ma_chambre }
      attente_s: { description: Secondes avant la première note, example: 600 }
      montee_s: { description: Secondes pour monter le volume, example: 600 }
    variables:
      enceinte: "{{ player | default('media_player.ma_chambre') }}"
      choix: >-
        {%- set p = states('input_text.reveil_playlist') | trim -%}
        {{- 'Détente' if p in ['', 'unknown', 'unavailable'] else p -}}
      attente: "{{ attente_s | default(0) | int }}"
      montee: "{{ montee_s | default(600) | int }}"
      pas_s: 30
      marches: "{{ [(montee / pas_s) | round(0, 'ceil') | int, 1] | max }}"
      v0: "{{ states('input_number.reveil_volume_debut') | float(0) }}"
      v1: "{{ states('input_number.reveil_volume_fin') | float(0) }}"
      jamais_regle: "{{ v0 == 0 and v1 == 0 }}"
      # Le plafond de la WiiM (packages/son.yaml) vaut aussi pour le matin :
      # 0, pas de plafond.
      plafond: >-
        {%- set m = states('input_number.volume_max') | float(0) -%}
        {{ m / 100 if m > 0 else 1 }}
      volume_debut: "{{ ([0.03 if jamais_regle else v0 / 100, plafond] | min) | round(2) }}"
      volume_fin: "{{ ([0.2 if jamais_regle else v1 / 100, plafond] | min) | round(2) }}"
    sequence:
      - condition: template
        value_template: "{{ choix != 'aucune' }}"
      - delay:
          seconds: "{{ attente }}"
      # Pas d'enceinte, pas de musique — et pas d'erreur non plus.
      - condition: template
        value_template: "{{ states(enceinte) not in ['unknown', 'unavailable'] }}"
      - service: media_player.volume_set
        target: { entity_id: "{{ enceinte }}" }
        data: { volume_level: "{{ volume_debut }}" }
      # Un nom comme une adresse : script.play_playlist sait les deux.
      - service: script.play_playlist
        data:
          name: "{{ choix }}"
          player: "{{ enceinte }}"
      - repeat:
          count: "{{ marches }}"
          sequence:
            - delay:
                seconds: "{{ pas_s }}"
            - service: media_player.volume_set
              target: { entity_id: "{{ enceinte }}" }
              data:
                volume_level: "{{ (volume_debut + (volume_fin - volume_debut) * repeat.index / marches) | round(2) }}"

  # « Je suis debout » : on coupe le lever et la musique, puis on fait de la
  # pièce ce que input_select.reveil_debout demande — rien, l'éclairage
  # « Réveillé », ou une ambiance. Une scène ou un script qui n'existe pas
  # (« Réveillé » jamais enregistré) est sauté sans erreur : la pièce reste
  # alors comme le lever l'a mise. Le réveil du lendemain n'est pas touché.
  #
  # L'existence se teste avec expand() et non states() : une scène jamais
  # activée existe bel et bien, mais son état vaut « unknown ».
  #
  # « scene.reveil_debout » nomme la scène par son IDENTIFIANT (le `id:` de
  # scenes.yaml), pas par son entity_id. Home Assistant tire l'entity_id du
  # NOM de la scène : « Réveillé » est devenue scene.reveille sur le Pi, et
  # jusqu'au 11 septembre 2026, « Je suis debout » cherchait
  # scene.reveil_debout, ne la trouvait pas, et laissait la pièce telle
  # quelle sans un mot. D'où la recherche par l'attribut `id`, quand
  # l'entity_id n'existe pas tel quel.
  reveil_stop:
    alias: Réveil · arrêter
    icon: mdi:alarm-off
    fields:
      player: { example: media_player.ma_chambre }
    variables:
      enceinte: "{{ player | default('media_player.ma_chambre') }}"
      choix: "{{ states('input_select.reveil_debout') }}"
      ensuite: >-
        {%- if choix.startswith('scene.') and expand(choix) | count == 0 -%}
          {{- states.scene | selectattr('attributes.id', 'defined')
                | selectattr('attributes.id', 'eq', choix[6:])
                | map(attribute='entity_id') | first | default('') -}}
        {%- else -%}
          {{- choix -}}
        {%- endif -%}
    sequence:
      - service: script.turn_off
        target: { entity_id: [script.reveil, script.reveil_musique, script.reveil_bonjour] }
      # Debout avant la fin du lever : pas de bonjour pour dire de se lever.
      - service: timer.cancel
        target: { entity_id: timer.reveil_bonjour }
      - if:
          - condition: template
            value_template: "{{ states(enceinte) not in ['unknown', 'unavailable'] }}"
        then:
          - service: media_player.media_stop
            target: { entity_id: "{{ enceinte }}" }
            continue_on_error: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ ensuite.startswith('scene.') and expand(ensuite) | count > 0 }}"
            sequence:
              - service: scene.turn_on
                target: { entity_id: "{{ ensuite }}" }
                data: { transition: 2 }
          - conditions:
              - condition: template
                value_template: "{{ ensuite.startswith('script.') and expand(ensuite) | count > 0 }}"
            sequence:
              - service: script.turn_on
                target: { entity_id: "{{ ensuite }}" }

  # Le bonjour : l'heure, l'ordre de se lever, la météo du jour, et bonne
  # journée. Le bulletin est celui que donne « quelle météo »
  # (sensor.meteo_bulletin, packages/meteo.yaml) ; absent, le bonjour s'en
  # passe plutôt que de dire qu'il ne l'a pas.
  #
  # Dit par script.annonce (packages/chambre.yaml) : le Voice PE, sinon la
  # WiiM.
  reveil_bonjour:
    alias: Réveil · bonjour
    icon: mdi:account-voice
    mode: restart
    variables:
      heure: >-
        {%- set h = now().hour -%}{%- set m = now().minute -%}
        {{ 'minuit' if h == 0 else 'midi' if h == 12 else h ~ (' heure' if h == 1 else ' heures') }}{{ ' ' ~ m if m else '' }}
      meteo: "{{ state_attr('sensor.meteo_bulletin', 'texte') | default('', true) | trim }}"
      message: >-
        Bonjour ! Il est {{ heure }}, c'est l'heure de te lever.
        {{ meteo }} Bonne journée !
    sequence:
      - service: script.annonce
        data: { message: "{{ message }}" }

  # Encore quelques minutes : le bonjour recule d'autant. Pendant le lever,
  # la fin du lever reste où elle est — seule la phrase attend. Le bonjour
  # déjà dit, il revient dans ces minutes-là : le rappel. Hors d'un réveil
  # (rien en cours, pas de bonjour dans l'heure), rien : un « encore cinq
  # minutes » dit l'après-midi ne doit pas faire parler la chambre.
  reveil_prolonger:
    alias: Réveil · prolonger
    icon: mdi:alarm-snooze
    fields:
      minutes: { description: Minutes de plus, example: 5 }
    variables:
      ajout: "{{ (minutes | default(5) | int(5)) * 60 }}"
      # Lu directement à chaque fois : une variable de script ne garde pas
      # un objet d'état, elle le réduirait en texte.
      actif: "{{ is_state('timer.reveil_bonjour', 'active') }}"
      reste: >-
        {%- set fin = state_attr('timer.reveil_bonjour', 'finishes_at') -%}
        {{ [(as_datetime(fin) - now()).total_seconds(), 0] | max | int if actif and fin else 0 }}
      # Le bonjour dit il y a moins d'une heure — mais pas annulé par « Je
      # suis debout » : levé, on ne se fait pas rappeler. reveil_stop annule
      # le minuteur juste après s'être lancé, d'où la minute d'écart.
      recent: >-
        {%- set t = states.timer.reveil_bonjour -%}
        {%- set debout = state_attr('script.reveil_stop', 'last_triggered') -%}
        {{ t is not none and (now() - t.last_changed).total_seconds() < 3600
           and (debout is none or (t.last_changed - as_datetime(debout | string)).total_seconds() > 60) }}
      total: "{{ reste + ajout }}"
    sequence:
      # Sans erreur : la phrase vocale relit le minuteur et dit elle-même
      # qu'il n'y a rien en cours.
      - if:
          - condition: template
            value_template: "{{ not (actif or recent or is_state('script.reveil', 'on')) }}"
        then:
          - stop: "Pas de réveil en cours : rien à prolonger"
      - service: timer.start
        target: { entity_id: timer.reveil_bonjour }
        data:
          duration: "{{ '%02d:%02d:%02d' | format(total // 3600, (total % 3600) // 60, total % 60) }}"

  # LE COUCHER DE SOLEIL : la courbe de input_text.coucher_courbe sur
  # input_number.coucher_duree minutes, par les mêmes marches que le lever.
  # Chaque lampe de input_text.coucher_lumieres suit la courbe jusqu'à son
  # moment, puis s'éteint en fondu ; au bout, tout ce qui reste s'éteint.
  # La musique descend en même temps (script.coucher_musique), confiée comme
  # au lever par un script.turn_on qui n'attend pas.
  #
  # Avant tout, si la chambre est trop chaude ou trop froide, il le dit
  # (sensor.chambre_conseil, packages/chambre.yaml) — sauf appelé par la
  # voix, qui le dit déjà dans sa réponse.
  coucher:
    alias: Coucher de soleil
    icon: mdi:weather-sunset-down
    mode: restart
    fields:
      duree:
        description: Minutes du coucher. Par défaut, input_number.coucher_duree.
        example: 20
      alerte:
        description: Annoncer une chambre trop chaude ou trop froide
        example: true
    variables:
      sens: coucher
      source_lumieres: input_text.coucher_lumieres
      source_courbe: input_text.coucher_courbe
      # Rien de choisi : les lampes allumées maintenant, jusqu'au bout.
      lampes_defaut: >-
        {%- set ns = namespace(l=[]) -%}
        {%- for e in expand('light.chambre', 'light.chambre_bandeau', 'light.chambre_wiz_1', 'light.chambre_wiz_2')
              if e.state == 'on' -%}
          {%- set ns.l = ns.l + [{'id': e.entity_id, 'p': 0}] -%}
        {%- endfor -%}
        {{ ns.l }}
      courbe_defaut: ["0,60,k2700", "100,1,k2000"]
      minutes: "{{ [duree | default(states('input_number.coucher_duree')) | int(20), 1] | max }}"
      lampes: *courbe_lampes
      points: *courbe_points
      pas_s: 30
      marches: *courbe_marches
    sequence:
      - service: timer.start
        target: { entity_id: timer.coucher }
        data:
          duration: "{{ '%02d:%02d:00' | format(minutes // 60, minutes % 60) }}"
      - variables:
          conseil: "{{ state_attr('sensor.chambre_conseil', 'texte') | default('', true) | trim }}"
      - if:
          - condition: template
            value_template: "{{ alerte | default(true) | bool(true) and conseil != '' }}"
        then:
          - service: script.turn_on
            target: { entity_id: script.annonce }
            data:
              variables: { message: "{{ conseil }}" }
      - service: script.turn_on
        target: { entity_id: script.coucher_musique }
        data:
          variables: { descente_s: "{{ minutes * 60 }}" }
      - *courbe_deroulee
      # La dernière marche a posé la fin de la courbe ; on la laisse se
      # faire, puis la chambre s'éteint.
      - delay:
          seconds: "{{ pas_s }}"
      - if:
          - condition: template
            value_template: "{{ lampes | count > 0 }}"
        then:
          - service: light.turn_off
            target: { entity_id: "{{ lampes | map(attribute='id') | list }}" }
            data: { transition: 5 }

  # La musique du soir : elle part de son volume de départ et descend à zéro
  # sur toute la durée du coucher, puis se met en PAUSE — « lance musique »
  # la reprend — et l'enceinte retrouve ce volume de départ, sans quoi la
  # musique suivante partirait muette.
  coucher_musique:
    alias: Coucher · musique
    icon: mdi:music-note-off
    mode: restart
    fields:
      player: { example: media_player.ma_chambre }
      descente_s: { description: Secondes pour descendre à zéro, example: 1200 }
    variables:
      enceinte: "{{ player | default('media_player.ma_chambre') }}"
      choix: >-
        {%- set p = states('input_text.coucher_playlist') | trim -%}
        {{- '' if p in ['unknown', 'unavailable'] else p -}}
      descente: "{{ descente_s | default(1200) | int(1200) }}"
      pas_s: 30
      marches: "{{ [(descente / pas_s) | round(0, 'ceil') | int, 1] | max }}"
      plafond: >-
        {%- set m = states('input_number.volume_max') | float(0) -%}
        {{ m / 100 if m > 0 else 1 }}
      v0: "{{ states('input_number.coucher_volume_debut') | float(0) }}"
      depart: >-
        {%- set actuel = state_attr(enceinte, 'volume_level') | float(0.1) -%}
        {{ ([v0 / 100 if v0 > 0 else actuel, plafond] | min) | round(2) }}
    sequence:
      - condition: template
        value_template: "{{ choix | lower != 'aucune' and states(enceinte) not in ['unknown', 'unavailable'] }}"
      - service: media_player.volume_set
        target: { entity_id: "{{ enceinte }}" }
        data: { volume_level: "{{ depart }}" }
      - if:
          - condition: template
            value_template: "{{ choix != '' }}"
        then:
          - service: script.play_playlist
            data: { name: "{{ choix }}", player: "{{ enceinte }}", aleatoire: true }
      # Rien ne joue, rien à faire descendre.
      - condition: template
        value_template: "{{ is_state(enceinte, 'playing') }}"
      - repeat:
          count: "{{ marches }}"
          sequence:
            - delay:
                seconds: "{{ pas_s }}"
            - service: media_player.volume_set
              target: { entity_id: "{{ enceinte }}" }
              data:
                volume_level: "{{ (depart * (1 - repeat.index / marches)) | round(2) }}"
      - service: media_player.media_pause
        target: { entity_id: "{{ enceinte }}" }
        continue_on_error: true
      - service: media_player.volume_set
        target: { entity_id: "{{ enceinte }}" }
        data: { volume_level: "{{ depart }}" }

  # Arrêter le coucher : la lumière et la musique restent où elles en sont.
  coucher_stop:
    alias: Coucher · arrêter
    icon: mdi:stop-circle-outline
    sequence:
      - service: script.turn_off
        target: { entity_id: [script.coucher, script.coucher_musique] }
      - service: timer.cancel
        target: { entity_id: timer.coucher }

# Ce que la voix peut faire au réveil. Les phrases sont dans
# custom_sentences/fr/reveil.yaml ; ici, ce que chacune déclenche et ce
# qu'Assist répond. Les mots entre accolades de la phrase ({reveil_heure},
# {reveil_minutes}) arrivent tels quels dans les gabarits.
intent_script:
  ReglerReveil:
    action:
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.reveil_heure }
        data:
          time: "{{ '%02d:%02d:00' | format(reveil_heure | int, reveil_minutes | default(0) | int) }}"
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.reveil_actif }
    # La confirmation relit le réglage APRÈS l'avoir écrit : elle dit ce que
    # le Pi a retenu, pas ce qu'il a cru entendre. Une heure mal comprise
    # s'entend donc tout de suite, et pas le lendemain matin.
    speech:
      text: >-
        {%- set h = states('input_datetime.reveil_heure').split(':') -%}
        {%- set hh = h[0] | int(0) -%}{%- set mm = h[1] | int(0) if h | count > 1 else 0 -%}
        {%- set jour = 'demain' if (hh * 60 + mm) <= (now().hour * 60 + now().minute) else "aujourd'hui" -%}
        C'est noté : réveil {{ jour }} à {{ hh }} {{ 'heure' if hh == 1 else 'heures' }}{% if mm %} {{ mm }}{% endif %}.
  ActiverReveil:
    action:
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.reveil_actif }
    speech:
      text: >-
        {%- set h = states('input_datetime.reveil_heure').split(':') -%}
        Réveil activé, à {{ h[0] | int }} heures{% if h[1] | int %} {{ h[1] | int }}{% endif %}.
  DesactiverReveil:
    action:
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.reveil_actif }
    speech:
      text: "Réveil désactivé : pas de réveil demain matin."
  ArreterReveil:
    action:
      - service: script.reveil_stop
    speech:
      text: "Bonjour."
  ProlongerReveil:
    action:
      - service: script.reveil_prolonger
        data:
          minutes: "{{ reveil_prolonge | default(5) | int(5) }}"
    # Pas d'effet qui s'entende : la phrase confirme, en relisant le
    # minuteur — appelé directement, le script a fini quand elle se dit.
    speech:
      text: >-
        {%- if is_state('timer.reveil_bonjour', 'active') -%}
          {%- set fin = as_local(as_datetime(state_attr('timer.reveil_bonjour', 'finishes_at'))) -%}
          Encore {{ reveil_prolonge | default(5) | int(5) }} minutes. Je te redis bonjour à {{ fin.hour }} heures{{ ' ' ~ fin.minute if fin.minute else '' }}.
        {%- else -%}
          Pas de réveil en cours.
        {%- endif -%}

  # « Bonne nuit », « bonne nuit dans 20 minutes ». L'effet est lent, il ne
  # se voit pas tout de suite : la phrase le confirme, avec la durée, et
  # dit la chambre trop chaude ou trop froide — le script ne le répète pas.
  CoucherSoleil:
    action:
      - service: script.turn_on
        target: { entity_id: script.coucher }
        data:
          variables:
            duree: "{{ coucher_minutes | default(states('input_number.coucher_duree')) | int(20) }}"
            alerte: false
    speech:
      text: >-
        {%- set m = coucher_minutes | default(states('input_number.coucher_duree')) | int(20) -%}
        {%- set conseil = state_attr('sensor.chambre_conseil', 'texte') | default('', true) | trim -%}
        Bonne nuit. La lumière baisse sur {{ m }} minute{{ 's' if m > 1 else '' }}.{{ ' ' ~ conseil if conseil else '' }}
  ArreterCoucher:
    action:
      - service: script.coucher_stop
    speech:
      text: "D'accord, j'arrête le coucher."
