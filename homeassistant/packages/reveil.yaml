# Le réveil, en un seul fichier : ses réglages, le script qui fait lever le
# jour, celui qui fait entrer la musique, l'automatisation qui les déclenche
# à l'heure dite, ce que fait « Je suis debout », et les phrases qu'Assist
# comprend.
#
# C'est un « package » Home Assistant : chaque clé (input_datetime, script,
# automation…) est fusionnée avec celles de configuration.yaml. Tout ce qui
# concerne le réveil vit donc ici, et nulle part ailleurs.
#
# TOUS LES RÉGLAGES SONT DES HELPERS, ÉCRITS PAR L'APP, ET AUCUN N'A
# D'`initial:`. Ce n'est pas un oubli. Un helper qui porte `initial:` y
# revient à CHAQUE démarrage de Home Assistant, au lieu de reprendre sa
# dernière valeur : l'heure réglée à 6 h 30 depuis le natel redevenait 7 h
# au premier `git pull` suivi d'un redémarrage, sans que rien ne le signale.
# C'était le cas jusqu'au 11 septembre 2026. Sans `initial:`, Home Assistant
# restaure la valeur d'avant l'arrêt. La contrepartie ne joue qu'une fois,
# sur une installation neuve : chaque nombre part de son minimum, et les
# scripts remplacent les textes vides par leurs valeurs par défaut.

input_datetime:
  reveil_heure:
    name: Heure du réveil
    icon: mdi:alarm
    has_date: false
    has_time: true

input_boolean:
  reveil_actif:
    name: Réveil actif
    icon: mdi:alarm-check

input_number:
  reveil_duree:
    name: Durée du lever
    icon: mdi:weather-sunset-up
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    mode: slider
  # La musique : combien de minutes après le début du lever elle entre, et
  # le volume auquel elle commence puis finit — le second atteint à la fin
  # du lever. Les deux à 0 % veulent dire « jamais réglé » : le script prend
  # alors 3 % → 20 %, les valeurs d'avant ces réglages.
  reveil_musique_delai:
    name: Réveil · musique après
    icon: mdi:timer-music-outline
    min: 0
    max: 60
    step: 1
    unit_of_measurement: min
    mode: slider
  reveil_volume_debut:
    name: Réveil · volume de départ
    icon: mdi:volume-low
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
  reveil_volume_fin:
    name: Réveil · volume final
    icon: mdi:volume-high
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider

input_text:
  # Les lumières qui se lèvent, séparées par des virgules, chacune avec le
  # moment où elle entre — « light.chambre,light.chambre_wiz_1@26 » : la
  # lampe dès le début, la WiZ à 26 % du lever, puis les deux sur la même
  # courbe. Sans @, dès le début. Vide : light.chambre seule.
  reveil_lumieres:
    name: Réveil · lumières
    icon: mdi:lightbulb-group
    max: 255
  # La courbe du lever : des points « position,intensité,couleur » séparés
  # par des points-virgules, dans n'importe quel ordre —
  #   0,1,k2000;40,30,ff8a3c;100,80,k4000
  # La position est un pourcentage de la durée du lever : allonger le réveil
  # étire la courbe, sans rien régler d'autre. L'intensité est un
  # pourcentage. La couleur est un blanc en kelvins (k2000) ou une teinte en
  # hexadécimal (ff8a3c). Moins de deux points valables : la courbe par
  # défaut, braise à 1 % → jour à 78 %, celle d'avant ces réglages. L'app
  # (src/couleur.ts) lit ce texte de la même façon.
  reveil_courbe:
    name: Réveil · courbe
    icon: mdi:chart-bell-curve-cumulative
    max: 255
  # Ce que joue la musique : un nom de la table de script.play_playlist
  # (« Détente »), ou l'adresse d'une playlist de la bibliothèque de Music
  # Assistant (« library://playlist/83 »). « aucune » : pas de musique. Vide :
  # Détente, comme avant ces réglages.
  reveil_playlist:
    name: Réveil · playlist
    icon: mdi:playlist-music
    max: 255

input_select:
  # Ce que fait « Je suis debout », une fois le lever et la musique coupés.
  # Les options sont des entity_id : l'app les nomme (APRES_REVEIL dans
  # config.ts, même ordre), le script les lance. « rien » laisse la pièce
  # comme le lever l'a mise — le comportement d'avant ce réglage.
  reveil_debout:
    name: Réveil · au lever
    icon: mdi:human-greeting
    options:
      - rien
      - scene.reveil_debout
      - script.mood_detente
      - script.mood_focus
      - script.mood_chillos
      - script.mood_calin
      # Les ambiances ajoutées depuis l'app ; l'app ne propose que les
      # places remplies.
      - script.mood_perso_1
      - script.mood_perso_2
      - script.mood_perso_3
      - script.mood_perso_4
      - script.mood_perso_5
      - script.mood_perso_6

automation:
  - id: reveil_a_l_heure
    alias: Réveil → lever de soleil
    description: À l'heure du réveil, si le réveil est actif, lance script.reveil.
    trigger:
      # Un input_datetime sans date sonne chaque jour à la même heure.
      - platform: time
        at: input_datetime.reveil_heure
    condition:
      - condition: state
        entity_id: input_boolean.reveil_actif
        state: "on"
    action:
      - service: script.reveil

script:
  # Le lever de soleil, lu dans les helpers : les lumières de
  # input_text.reveil_lumieres suivent la courbe de input_text.reveil_courbe
  # sur input_number.reveil_duree minutes, chacune à partir de son moment
  # d'entrée. Avant ce moment, une lampe n'est pas touchée ; au moment venu,
  # elle s'allume en fondu, sur les 30 s de la marche, jusqu'à là où en est
  # la courbe, puis monte avec les autres.
  #
  # Le Pi avance par marches de 30 s et demande à chaque lampe une transition
  # de 30 s vers la marche suivante. Sur une Hue, on ne voit aucun saut. Les
  # WiZ ne savent pas les transitions : elles font un petit pas toutes les
  # 30 s, ce qui reste doux parce que la marche est petite. C'est la raison de
  # ne pas confier chaque segment de la courbe à une seule longue transition,
  # que les WiZ franchiraient d'un bond.
  #
  # Entre deux points, l'intensité et la couleur sont interpolées. Deux blancs
  # donnent des kelvins, que la lampe rend comme un vrai blanc. Dès qu'une
  # teinte est en jeu, le segment passe en RVB, les blancs y étant convertis
  # par l'approximation de Tanner Helland — calculée une fois, à la lecture
  # de la courbe, pas à chaque marche.
  #
  # La musique n'est PAS dans ce script : elle est confiée à
  # script.reveil_musique par un script.turn_on, qui n'attend pas et dont les
  # erreurs ne remontent pas ici. Sans enceinte, la lumière se lève quand
  # même. C'est le contraire des ambiances, où le son qui échoue empêche
  # l'écho — un réveil qui n'allume pas parce que Spotify ne répond pas ferait
  # rater le train.
  reveil:
    alias: Réveil
    icon: mdi:weather-sunset-up
    mode: restart
    fields:
      duree:
        description: Minutes du lever. Par défaut, input_number.reveil_duree.
        example: 20
    variables:
      minutes: "{{ [duree | default(states('input_number.reveil_duree')) | int(20), 1] | max }}"
      # [{'id': 'light.chambre', 'p': 0}, {'id': 'light.chambre_wiz_1', 'p': 26}]
      lampes: >-
        {%- set ns = namespace(l=[]) -%}
        {%- for m in states('input_text.reveil_lumieres').split(',') -%}
          {%- set x = m.split('@') | map('trim') | list -%}
          {%- if x[0] is match('light[.]') -%}
            {%- set p = x[1] | float(0) if x | count > 1 else 0 -%}
            {%- set ns.l = ns.l + [{'id': x[0], 'p': [[p, 0] | max, 100] | min}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.l if ns.l else [{'id': 'light.chambre', 'p': 0}] -}}
      points: >-
        {%- set brut = states('input_text.reveil_courbe') | lower -%}
        {%- set motif = '^[ ]*[0-9.]+[ ]*,[ ]*[0-9.]+[ ]*,[ ]*(k[0-9]{4,5}|[0-9a-f]{6})[ ]*$' -%}
        {%- set valides = brut.split(';') | select('match', motif) | list -%}
        {%- set morceaux = valides if valides | count >= 2 else ['0,1,k2000', '100,78,k4000'] -%}
        {%- set ns = namespace(l=[]) -%}
        {%- for m in morceaux -%}
          {%- set x = m.split(',') | map('trim') | list -%}
          {%- set c = x[2] -%}
          {%- if c[0] == 'k' -%}
            {%- set k = c[1:] | int -%}
            {%- set t = k / 100 -%}
            {%- set r = 255 if t <= 66 else 329.698727446 * (t - 60) ** -0.1332047592 -%}
            {%- set g = 99.4708025861 * log(t) - 161.1195681661 if t <= 66
                  else 288.1221695283 * (t - 60) ** -0.0755148492 -%}
            {%- set b = 255 if t >= 66 else 0 if t <= 19
                  else 138.5177312231 * log(t - 10) - 305.0447927307 -%}
          {%- else -%}
            {%- set k = none -%}
            {%- set r = c[0:2] | int(0, 16) -%}
            {%- set g = c[2:4] | int(0, 16) -%}
            {%- set b = c[4:6] | int(0, 16) -%}
          {%- endif -%}
          {%- set ns.l = ns.l + [{
                'p': [[x[0] | float(0), 0] | max, 100] | min,
                'b': [[x[1] | float(0), 0] | max, 100] | min,
                'k': k,
                'rgb': [r, g, b] | map('round') | map('int') | list }] -%}
        {%- endfor -%}
        {{- ns.l | sort(attribute='p') -}}
      pas_s: 30
      # Au moins deux marches, même pour une minute : une seule serait un
      # allumage sec, pas un lever.
      marches: "{{ [(minutes * 60 / pas_s) | round(0, 'ceil') | int, 2] | max }}"
      # La musique entre au même moment RELATIF du lever, vrai réveil ou
      # essai d'une minute : l'essai reste une miniature fidèle du matin.
      duree_reglee: "{{ [states('input_number.reveil_duree') | float(20), 1] | max }}"
      delai_min: "{{ states('input_number.reveil_musique_delai') | float(10) }}"
      attente_s: "{{ (([delai_min / duree_reglee, 1] | min) * minutes * 60) | int }}"
      montee_s: "{{ [minutes * 60 - attente_s, 60] | max | int }}"
    sequence:
      - service: script.turn_on
        target: { entity_id: script.reveil_musique }
        data:
          variables:
            attente_s: "{{ attente_s }}"
            montee_s: "{{ montee_s }}"
      # marches + 1 ordres : le premier pose le point de départ, le dernier
      # atteint la fin de la courbe.
      - repeat:
          count: "{{ marches + 1 }}"
          sequence:
            - variables:
                # Où en est le lever, en pourcentage, et les lampes dont le
                # moment est venu.
                pr: "{{ (repeat.index - 1) / marches * 100 }}"
                actives: "{{ lampes | selectattr('p', '<=', pr | float) | map(attribute='id') | list }}"
                etape: >-
                  {%- set ns = namespace(a=points[0], b=points[-1]) -%}
                  {%- for pt in points -%}
                    {%- if pt.p <= pr -%}{%- set ns.a = pt -%}{%- endif -%}
                  {%- endfor -%}
                  {%- for pt in points | reverse -%}
                    {%- if pt.p >= pr -%}{%- set ns.b = pt -%}{%- endif -%}
                  {%- endfor -%}
                  {%- set t = 0 if ns.b.p <= ns.a.p else (pr - ns.a.p) / (ns.b.p - ns.a.p) -%}
                  {%- set lum = (ns.a.b + (ns.b.b - ns.a.b) * t) | round(1) -%}
                  {%- if ns.a.k is not none and ns.b.k is not none -%}
                    {{- {'b': lum, 'k': (ns.a.k + (ns.b.k - ns.a.k) * t) | round(0) | int, 'rgb': none} -}}
                  {%- else -%}
                    {{- {'b': lum, 'k': none, 'rgb': [
                          (ns.a.rgb[0] + (ns.b.rgb[0] - ns.a.rgb[0]) * t) | round(0) | int,
                          (ns.a.rgb[1] + (ns.b.rgb[1] - ns.a.rgb[1]) * t) | round(0) | int,
                          (ns.a.rgb[2] + (ns.b.rgb[2] - ns.a.rgb[2]) * t) | round(0) | int]} -}}
                  {%- endif -%}
            # Aucune lampe encore entrée : la marche passe sans rien allumer.
            - if:
                - condition: template
                  value_template: "{{ actives | count > 0 }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ etape.k is not none }}"
                  then:
                    - service: light.turn_on
                      target: { entity_id: "{{ actives }}" }
                      data:
                        brightness_pct: "{{ etape.b }}"
                        color_temp_kelvin: "{{ etape.k }}"
                        transition: "{{ pas_s }}"
                  else:
                    - service: light.turn_on
                      target: { entity_id: "{{ actives }}" }
                      data:
                        brightness_pct: "{{ etape.b }}"
                        rgb_color: "{{ etape.rgb }}"
                        transition: "{{ pas_s }}"
            - if:
                - condition: template
                  value_template: "{{ repeat.index <= marches }}"
              then:
                - delay:
                    seconds: "{{ pas_s }}"

  # La musique du matin : elle entre après attente_s, au volume de départ,
  # puis monte jusqu'au volume final sur montee_s. Ce qu'elle joue vient de
  # input_text.reveil_playlist : un nom de la table de script.play_playlist,
  # ou une adresse de la bibliothèque de Music Assistant, jouée telle quelle.
  reveil_musique:
    alias: Réveil · musique
    icon: mdi:music-note
    mode: restart
    fields:
      player: { example: media_player.ma_chambre }
      attente_s: { description: Secondes avant la première note, example: 600 }
      montee_s: { description: Secondes pour monter le volume, example: 600 }
    variables:
      enceinte: "{{ player | default('media_player.ma_chambre') }}"
      choix: >-
        {%- set p = states('input_text.reveil_playlist') | trim -%}
        {{- 'Détente' if p in ['', 'unknown', 'unavailable'] else p -}}
      attente: "{{ attente_s | default(0) | int }}"
      montee: "{{ montee_s | default(600) | int }}"
      pas_s: 30
      marches: "{{ [(montee / pas_s) | round(0, 'ceil') | int, 1] | max }}"
      v0: "{{ states('input_number.reveil_volume_debut') | float(0) }}"
      v1: "{{ states('input_number.reveil_volume_fin') | float(0) }}"
      jamais_regle: "{{ v0 == 0 and v1 == 0 }}"
      # Le plafond de la WiiM (packages/son.yaml) vaut aussi pour le matin :
      # 0, pas de plafond.
      plafond: >-
        {%- set m = states('input_number.volume_max') | float(0) -%}
        {{ m / 100 if m > 0 else 1 }}
      volume_debut: "{{ ([0.03 if jamais_regle else v0 / 100, plafond] | min) | round(2) }}"
      volume_fin: "{{ ([0.2 if jamais_regle else v1 / 100, plafond] | min) | round(2) }}"
    sequence:
      - condition: template
        value_template: "{{ choix != 'aucune' }}"
      - delay:
          seconds: "{{ attente }}"
      # Pas d'enceinte, pas de musique — et pas d'erreur non plus.
      - condition: template
        value_template: "{{ states(enceinte) not in ['unknown', 'unavailable'] }}"
      - service: media_player.volume_set
        target: { entity_id: "{{ enceinte }}" }
        data: { volume_level: "{{ volume_debut }}" }
      # Un nom comme une adresse : script.play_playlist sait les deux.
      - service: script.play_playlist
        data:
          name: "{{ choix }}"
          player: "{{ enceinte }}"
      - repeat:
          count: "{{ marches }}"
          sequence:
            - delay:
                seconds: "{{ pas_s }}"
            - service: media_player.volume_set
              target: { entity_id: "{{ enceinte }}" }
              data:
                volume_level: "{{ (volume_debut + (volume_fin - volume_debut) * repeat.index / marches) | round(2) }}"

  # « Je suis debout » : on coupe le lever et la musique, puis on fait de la
  # pièce ce que input_select.reveil_debout demande — rien, l'éclairage
  # « Réveillé », ou une ambiance. Une scène ou un script qui n'existe pas
  # (« Réveillé » jamais enregistré) est sauté sans erreur : la pièce reste
  # alors comme le lever l'a mise. Le réveil du lendemain n'est pas touché.
  #
  # L'existence se teste avec expand() et non states() : une scène jamais
  # activée existe bel et bien, mais son état vaut « unknown ».
  #
  # « scene.reveil_debout » nomme la scène par son IDENTIFIANT (le `id:` de
  # scenes.yaml), pas par son entity_id. Home Assistant tire l'entity_id du
  # NOM de la scène : « Réveillé » est devenue scene.reveille sur le Pi, et
  # jusqu'au 11 septembre 2026, « Je suis debout » cherchait
  # scene.reveil_debout, ne la trouvait pas, et laissait la pièce telle
  # quelle sans un mot. D'où la recherche par l'attribut `id`, quand
  # l'entity_id n'existe pas tel quel.
  reveil_stop:
    alias: Réveil · arrêter
    icon: mdi:alarm-off
    fields:
      player: { example: media_player.ma_chambre }
    variables:
      enceinte: "{{ player | default('media_player.ma_chambre') }}"
      choix: "{{ states('input_select.reveil_debout') }}"
      ensuite: >-
        {%- if choix.startswith('scene.') and expand(choix) | count == 0 -%}
          {{- states.scene | selectattr('attributes.id', 'defined')
                | selectattr('attributes.id', 'eq', choix[6:])
                | map(attribute='entity_id') | first | default('') -}}
        {%- else -%}
          {{- choix -}}
        {%- endif -%}
    sequence:
      - service: script.turn_off
        target: { entity_id: [script.reveil, script.reveil_musique] }
      - if:
          - condition: template
            value_template: "{{ states(enceinte) not in ['unknown', 'unavailable'] }}"
        then:
          - service: media_player.media_stop
            target: { entity_id: "{{ enceinte }}" }
            continue_on_error: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ ensuite.startswith('scene.') and expand(ensuite) | count > 0 }}"
            sequence:
              - service: scene.turn_on
                target: { entity_id: "{{ ensuite }}" }
                data: { transition: 2 }
          - conditions:
              - condition: template
                value_template: "{{ ensuite.startswith('script.') and expand(ensuite) | count > 0 }}"
            sequence:
              - service: script.turn_on
                target: { entity_id: "{{ ensuite }}" }

# Ce que la voix peut faire au réveil. Les phrases sont dans
# custom_sentences/fr/reveil.yaml ; ici, ce que chacune déclenche et ce
# qu'Assist répond. Les mots entre accolades de la phrase ({reveil_heure},
# {reveil_minutes}) arrivent tels quels dans les gabarits.
intent_script:
  ReglerReveil:
    action:
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.reveil_heure }
        data:
          time: "{{ '%02d:%02d:00' | format(reveil_heure | int, reveil_minutes | default(0) | int) }}"
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.reveil_actif }
    speech:
      text: >-
        Réveil à {{ reveil_heure | int }} heures{% if reveil_minutes | default(0) | int %} {{ reveil_minutes | int }}{% endif %}.
  ActiverReveil:
    action:
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.reveil_actif }
    speech:
      text: >-
        {%- set h = states('input_datetime.reveil_heure').split(':') -%}
        Réveil activé, à {{ h[0] | int }} heures{% if h[1] | int %} {{ h[1] | int }}{% endif %}.
  DesactiverReveil:
    action:
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.reveil_actif }
    speech:
      text: "Pas de réveil."
  ArreterReveil:
    action:
      - service: script.reveil_stop
    speech:
      text: "Bonjour."
