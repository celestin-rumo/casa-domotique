# Le son de la WiiM, tenu en laisse.
#
# La WiiM Sound Lite est puissante : à 3 %, elle s'entend déjà dans toute la
# chambre, et les volumes des ambiances d'avant (15 à 25 %) la faisaient
# hurler. Deux réglages la maîtrisent :
#
# - le volume de chaque ambiance, dans packages/ambiances.yaml ;
# - ici, un plafond que rien ne dépasse : ni une ambiance, ni le réveil, ni
#   le curseur d'Écoute, ni l'app WiiM, ni la télécommande. Home Assistant
#   ramène aussitôt l'enceinte au plafond si quelqu'un le franchit.
#
# 0 veut dire « pas de plafond ». Ce n'est pas un choix de confort : sans
# `initial:` (packages/reveil.yaml dit pourquoi), un helper neuf part de son
# minimum, et un minimum à 1 aurait bridé la WiiM à 1 % au premier
# redémarrage, sans que rien ne le dise.
input_number:
  volume_max:
    name: Son · plafond de la WiiM
    icon: mdi:volume-vibrate
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider

automation:
  # Les deux WiiM depuis le déménagement de novembre 2026, chambre et salon :
  # un seul plafond pour les deux, puisque c'est la même enceinte.
  - id: volume_plafond
    alias: Son → plafond des WiiM
    description: Ramène media_player.ma_chambre et media_player.ma_salon au plafond de input_number.volume_max dès qu'elles le dépassent.
    mode: queued
    variables:
      enceintes: [media_player.ma_chambre, media_player.ma_salon]
    trigger:
      # Le volume qui bouge, d'où qu'il vienne, et le plafond qu'on abaisse
      # sous le volume en cours.
      - platform: state
        entity_id: [media_player.ma_chambre, media_player.ma_salon]
        attribute: volume_level
      - platform: state
        entity_id: input_number.volume_max
    action:
      # Chaque enceinte au-dessus, et elle seule. Un demi-point de marge :
      # l'enceinte arrondit, et 12 % peut revenir en 0,1201.
      - variables:
          m: "{{ states('input_number.volume_max') | float(0) }}"
      - repeat:
          for_each: "{{ enceintes }}"
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ m | float(0) > 0 and has_value(repeat.item)
                       and (state_attr(repeat.item, 'volume_level') | float(0)) * 100 > m | float(0) + 0.5 }}
              then:
                - service: media_player.volume_set
                  target: { entity_id: "{{ repeat.item }}" }
                  data:
                    volume_level: "{{ (m | float(100) / 100) | round(2) }}"
