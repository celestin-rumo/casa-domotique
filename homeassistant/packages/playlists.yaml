# Les playlists épinglées depuis l'app (Écoute → Ajouter une playlist).
# Music Assistant voit déjà toute la bibliothèque Spotify — plus de cent
# playlists sur ce compte —, trop pour une liste qu'on parcourt : on ne garde
# ici que celles qu'on a choisies.
#
# Le format : les numéros de playlist de la bibliothèque de Music Assistant,
# séparés par des virgules — « 83,50,72 » pour library://playlist/83, /50 et
# /72. Des numéros plutôt que les adresses entières, parce qu'un input_text
# ne tient que 255 caractères : une soixantaine d'épingles, là où les
# adresses n'en laisseraient qu'une dizaine. Ces numéros sont ceux de la base
# de Music Assistant ; ils tiennent tant que sa bibliothèque n'est pas
# reconstruite de zéro.
#
# Les playlists des ambiances ne sont pas ici : chacune a son réglage
# (packages/ambiances.yaml), qui retombe sur un nom de la table de
# script.play_playlist quand il est vide.
#
# Pas d'`initial:`, pour la même raison que les réglages du réveil
# (packages/reveil.yaml) : il viderait la liste à chaque redémarrage.
input_text:
  playlists_epinglees:
    name: Playlists épinglées
    icon: mdi:pin
    max: 255

  # Ce que l'enceinte joue, tel que script.play_playlist l'a lancé : un nom
  # de la table ou une adresse. L'enceinte ne le dit pas elle-même — son
  # media_content_id est le morceau, jamais la playlist —, et c'est cet écho
  # qui dit à Écoute quelle ligne allumer. Sans lui, constaté le 11 septembre
  # 2026, une épinglée lancée laissait « Détente » affichée en lecture.
  playlist_courante:
    name: Playlist en cours
    icon: mdi:playlist-play
    max: 255

  # Les noms donnés depuis l'app (appui long sur une playlist d'Écoute) :
  # « 30=Soirée;Détente=Le soir ». La clé est le numéro d'une épinglée, ou le
  # nom d'une playlist de la table. Seul l'affichage change : les scripts
  # jouent toujours la même adresse, et les réglages gardent la même valeur.
  playlists_noms:
    name: Playlists · noms
    icon: mdi:rename
    max: 255
