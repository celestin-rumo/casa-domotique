# Ce que la voix fait des lampes au-delà des ordres intégrés. Les phrases sont
# dans custom_sentences/fr/lumieres.yaml, qui dit ce qui manquait et pourquoi.
#
# Les scripts vivent ICI plutôt que dans scripts.yaml. Un package porte sa
# fonction entière, comme le réveil et la météo, et cela évite de toucher un
# fichier que d'autres modifient au même moment.
#
# UN ORDRE VISE LA PIÈCE DU SATELLITE QUI L'A ENTENDU. Depuis le
# déménagement de novembre 2026, il y a un Voice PE par pièce (chambre, puis
# salon), et « baisse la lumière » dit au salon doit baisser le salon.
#
# Home Assistant le permet sans rien inventer : quand la phrase vient d'un
# satellite rangé dans une zone, chaque intent reçoit le slot
# `preferred_area_id` (default_agent.py, `_async_execute_intent`, vérifié dans
# HA 2026.9). Sans satellite — l'app, le clavier —, il est indéfini, d'où le
# `default('bedroom')` partout : la chambre reste la pièce par défaut.
#
# Les lampes d'une pièce sont alors celles de sa zone, calculées à chaque
# fois, jamais listées ici. Une lampe ajoutée au salon et rangée dans la zone
# Salon répond donc sans toucher au dépôt. Une seule expression, répétée à
# l'identique partout où il en faut une :
#
#     area_entities(piece) | select('match', 'light[.]')
#       | reject('search', '_led_ring$') | select('has_value') | list
#
# `_led_ring` écarte l'anneau lumineux du Voice PE, rangé dans la même zone
# mais qui n'éclaire rien ; `has_value` écarte les lampes injoignables et les
# entités désactivées, qu'aucun ordre ne saurait faire bouger.
#
# LE SALON COUVRE LA CUISINE, ouverte sur lui (27 novembre 2026) : ses
# lampes sont rangées dans la zone Cuisine, et le Voice PE du salon doit
# pourtant les commander. Chaque `area_entities(x)` des lampes s'écrit donc
#
#     (area_entities(x) + (area_entities('kitchen') if (x) == 'living_room' else []))
#
# — « éteins lampe » au salon, « tamise le salon » touchent la cuisine ;
# « cuisine » dit seul ne touche que la cuisine.
#
# Restent nommées en toutes lettres les lampes qu'on appelle par leur nom :
# « bandeau » et « lampe chambre ». Elles sont dans la chambre, et le restent
# d'où qu'on parle.
#
# Les deux ampoules WiZ et leur groupe `light.lampes_chambre` ont disparu avec
# le déménagement : « les lampes » veut désormais dire les lampes de la pièce.

script:
  # Un pas de luminosité, vers le haut ou vers le bas.
  #
  # Seules les lampes ALLUMÉES bougent. Sans ce filtre, un pas positif
  # rallumerait les lampes éteintes : `brightness_step_pct` sur une lampe
  # éteinte l'allume au niveau du pas. « Augmente la luminosité » doit
  # éclaircir la pièce telle qu'elle est, pas la rallumer entière.
  lumiere_pas:
    alias: Lumières · un pas de luminosité
    icon: mdi:brightness-6
    mode: restart
    fields:
      pas:
        description: Le pas en pourcent, négatif pour baisser
        example: -15
      cible:
        description: Une luminosité absolue, qui remplace le pas
        example: 7
      lampe:
        description: Le mot d'une lampe ; vide, toutes celles qui sont allumées
        example: bandeau
      piece:
        description: La zone dont les lampes bougent quand aucune n'est nommée
        example: bedroom
      plancher:
        description: La luminosité sous laquelle on ne descend jamais
        example: 7
    variables:
      # `default()` PARTOUT, et c'est vital. Un champ non fourni est indéfini,
      # et référencer un indéfini ici ne lève pas d'erreur : l'appel se fige,
      # le script ne démarre même pas, et rien n'apparaît dans les journaux.
      # Diagnostiqué le 23 septembre 2026, vingt secondes d'expiration à
      # chaque « tamise », pendant que « baisse » répondait en neuf
      # millisecondes — la seule différence était un `plancher` absent.
      mini: "{{ plancher | default(7) | int }}"
      # La table vit ici plutôt que dans chaque intent : trois copies
      # finiraient par diverger. Le `trim` compte, la valeur reçue peut
      # traîner une espace.
      mots:
        bandeau: light.chambre_bandeau
        lampe chambre: light.chambre
      mot: "{{ lampe | default('') | trim }}"
      # Aucun mot, ou « les lampes » : toute la pièce. « maison » : toutes les
      # lampes, toutes pièces confondues (« tamise partout »).
      zone: "{{ piece | default('bedroom') }}"
      candidates: >-
        {{ [mots[mot]] if mot in mots else
           (states.light | map(attribute='entity_id') | list if zone == 'maison' else (area_entities(zone) + (area_entities('kitchen') if (zone) == 'living_room' else [])))
           | select('match', 'light[.]')
           | reject('search', '_led_ring$') | select('has_value') | list }}
      allumees: >-
        {{ expand(candidates) | selectattr('state', 'eq', 'on')
           | map(attribute='entity_id') | list }}
    sequence:
      # Rien d'allumé : on s'arrête sans erreur et sans un mot. La pièce est
      # noire, la personne le voit.
      - condition: template
        value_template: "{{ allumees | count > 0 }}"

      # Lampe par lampe, et non toutes d'un coup. `brightness_step_pct`
      # appliquait le même pas à tout le monde et, surtout, ne savait pas
      # s'arrêter : à 10 % moins 15, la lampe s'éteignait. Ici chacune part de
      # SA luminosité et bute sur le plancher, jamais sur zéro. Une lampe
      # baissée à répétition finit donc à 7 % et y reste, allumée.
      - repeat:
          for_each: "{{ allumees }}"
          sequence:
            - variables:
                actuel: "{{ (state_attr(repeat.item, 'brightness') | int(0) / 2.55) | round(0) | int }}"
                # Une cible absolue l'emporte sur le pas : c'est « tamise
                # beaucoup », qui ne descend pas d'un cran mais va au plancher.
                vers: "{{ cible | default(0) | int }}"
                brut: "{{ vers if vers > 0 else actuel + (pas | default(0) | int) }}"
                vise: "{{ [[brut | int, 100] | min, mini | int] | max }}"
            - service: light.turn_on
              target: { entity_id: "{{ repeat.item }}" }
              data:
                brightness_pct: "{{ vise }}"

  # Tout éteindre sauf le bandeau, qui reste comme veilleuse.
  #
  # L'ordre intégré ne sait pas faire d'exception : il n'a pas de notion de
  # « sauf ». D'où les lampes de la chambre, moins le bandeau — et toujours la
  # chambre, puisque c'est là qu'est le bandeau, d'où qu'on parle.
  eteindre_sauf_bandeau:
    alias: Lumières · tout sauf le bandeau
    icon: mdi:lightbulb-night
    variables:
      autres: >-
        {{ area_entities('bedroom') | select('match', 'light[.]')
           | reject('search', '_led_ring$') | select('has_value')
           | reject('eq', 'light.chambre_bandeau') | list }}
    sequence:
      - condition: template
        value_template: "{{ autres | count > 0 }}"
      - service: light.turn_off
        target:
          entity_id: "{{ autres }}"

  # Le blanc d'une pièce, toutes ses lampes au MÊME blanc. Une pièce mêle des
  # Hue couleur (jusqu'à 2000 K) et des White Ambiance (2202 K au plus
  # chaud) : chacune à son propre extrême, elles ne se ressembleraient pas.
  # L'échelle va donc de l'extrême COMMUN chaud (le plus chaud que toutes
  # savent faire) à l'extrême commun froid, lus dans leurs attributs, et une
  # position de 0 à 100 % s'y place. Les lampes couleur quittent du même
  # coup leur teinte ; la luminosité ne bouge pas.
  #
  # `position` : un palier absolu, et toutes les lampes s'allument.
  # `pas` : ±20 depuis le palier le plus proche de la moyenne des lampes
  # allumées (neutre si aucune n'est en blanc), sur elles seules.
  #
  # Rien que des entity_id et des nombres dans les variables : un objet
  # d'état y deviendrait du texte, et le script ne ferait plus rien.
  lumiere_blanc:
    alias: Lumières · un blanc pour toute la pièce
    icon: mdi:thermometer-lines
    mode: restart
    fields:
      zone:
        description: "La zone, ou « maison »"
        example: kitchen
      mot:
        description: "Le mot de la pièce, cherché aussi dans le nom des lampes"
        example: cuisine
      position:
        description: "Le palier, de 0 (chaud) à 100 (froid)"
        example: 40
      pas:
        description: "Un palier relatif : -20 plus chaud, 20 plus froid"
        example: -20
    variables:
      z: "{{ zone | default('bedroom') }}"
      m: "{{ mot | default('') | trim }}"
      toutes: >-
        {{ (states.light | map(attribute='entity_id') | list if z == 'maison'
            else (area_entities(z) + (area_entities('kitchen') if (z) == 'living_room' else [])) + ((states.light | map(attribute='entity_id') | select('search', m) | list) if m else []))
           | select('match', 'light[.]') | reject('search', '_led_ring$')
           | select('has_value') | unique | list }}
      # Celles qui savent faire du blanc ; pour un pas, allumées seulement.
      ids: >-
        {{ expand(toutes) | selectattr('attributes.min_color_temp_kelvin', 'number')
           | selectattr('state', 'in', ['on'] if pas is defined else ['on', 'off'])
           | map(attribute='entity_id') | list }}
      chaud: "{{ expand(ids) | map(attribute='attributes.min_color_temp_kelvin') | max | default(2700) | int }}"
      froid: "{{ expand(ids) | map(attribute='attributes.max_color_temp_kelvin') | min | default(6500) | int }}"
      cible_pos: >-
        {%- if pas is defined -%}
          {%- set k = expand(ids) | map(attribute='attributes.color_temp_kelvin') | select('number') | list -%}
          {%- set ici = ((((k | sum / k | count) - chaud) / [froid - chaud, 1] | max * 5) | round(0) * 20) if k else 40 -%}
          {{ [[ici + pas | int, 0] | max, 100] | min }}
        {%- else -%}
          {{ [[position | default(40) | int, 0] | max, 100] | min }}
        {%- endif -%}
    sequence:
      - condition: template
        value_template: "{{ ids | count > 0 and froid >= chaud }}"
      - service: light.turn_on
        target: { entity_id: "{{ ids }}" }
        data:
          color_temp_kelvin: "{{ (chaud + (froid - chaud) * cible_pos | int / 100) | round(0) | int }}"

# Aucun `speech` nulle part : l'assistant ne confirme pas ce qui se voit. La
# règle du dépôt, posée le 22 septembre 2026, vaut ici comme pour les
# ambiances et la musique.
intent_script:
  EteindreSaufBandeau:
    action:
      - service: script.turn_on
        target: { entity_id: script.eteindre_sauf_bandeau }

  # Les trois pas. Le plancher de 7 % vit dans le script, pas ici : il vaut
  # pour toute baisse, d'où qu'elle vienne.
  # Les trois pas, chacun avec ou sans lampe nommée. `casa_lampe` est
  # INDÉFINI quand la phrase n'en contient pas : d'où le `default('')`, sans
  # lequel l'appel se figerait — c'est exactement la panne du 23 septembre.
  LuminositePlus:
    action:
      - service: script.turn_on
        target: { entity_id: script.lumiere_pas }
        data:
          variables:
            pas: 15
            lampe: "{{ casa_lampe | default('') }}"
            piece: "{{ preferred_area_id | default('bedroom') }}"

  LuminositeMoins:
    action:
      - service: script.turn_on
        target: { entity_id: script.lumiere_pas }
        data:
          variables:
            pas: -15
            lampe: "{{ casa_lampe | default('') }}"
            piece: "{{ preferred_area_id | default('bedroom') }}"

  # Tamiser n'est plus un synonyme de baisser : c'est le grand pas, celui du
  # soir, quand on veut passer de la lumière de travail à la veilleuse d'un
  # seul mot.
  #
  # Les deux tamisages marchent dans TOUTES les pièces : la pièce dite
  # (« tamise le salon », « tamise beaucoup partout »), sinon celle du
  # satellite. Même table mot → zone que les intents Piece* plus bas.
  Tamise:
    action:
      - service: script.turn_on
        target: { entity_id: script.lumiere_pas }
        data:
          variables:
            pas: -30
            lampe: "{{ casa_lampe | default('') }}"
            piece: >-
              {{ {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'}.get(casa_piece | default(''), preferred_area_id | default('bedroom')) }}

  # « Tamise beaucoup » ne descend pas d'un cran : il va droit au plancher.
  # D'où une cible absolue plutôt qu'un pas, sur tout ce qui est allumé.
  TamiseBeaucoup:
    action:
      - service: script.turn_on
        target: { entity_id: script.lumiere_pas }
        data:
          variables:
            cible: 7
            lampe: "{{ casa_lampe | default('') }}"
            piece: >-
              {{ {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'}.get(casa_piece | default(''), preferred_area_id | default('bedroom')) }}

  # « Mets bandeau à 100 pourcent ». Home Assistant comprend déjà la phrase,
  # mais le micro ne connaît, pour la luminosité, que « règle » et « allume » :
  # même manque que pour la couleur, même remède.
  #
  # La table des lampes est la jumelle de celles de CouleurLampe et
  # d'EtatLampe. Elles doivent rester d'accord : une lampe ajoutée à l'une
  # manque aux autres.
  LuminositeLampe:
    action:
      - variables:
          lampes:
            bandeau: light.chambre_bandeau
            lampe chambre: light.chambre
          # « les lampes » : celles de la pièce du satellite.
          cible: >-
            {{ [lampes[casa_lampe]] if casa_lampe in lampes else
               (area_entities(preferred_area_id | default('bedroom')) + (area_entities('kitchen') if (preferred_area_id | default('bedroom')) == 'living_room' else []))
               | select('match', 'light[.]') | reject('search', '_led_ring$')
               | select('has_value') | list }}
      - condition: template
        value_template: "{{ cible | count > 0 }}"
      - service: light.turn_on
        target: { entity_id: "{{ cible }}" }
        data:
          # Le plancher ne s'applique pas ici : une valeur demandée en toutes
          # lettres est un choix, pas une dérive. Zéro reste impossible, la
          # liste commençant à 5.
          brightness_pct: "{{ casa_pourcent | int }}"

  # « Mets le bandeau en rouge ». Deux traductions, parce que la phrase arrive
  # en français des deux côtés : le mot de la lampe vers son entity_id, et le
  # mot de la couleur vers le nom anglais qu'attend `color_name`.
  #
  # Pourquoi ne pas laisser faire l'ordre intégré, qui sait déjà poser une
  # couleur : parce qu'il ne connaît que les verbes « allume » et « règle »
  # côté micro. Ce bloc n'existe que pour le verbe « mets ». Les deux autres
  # tournures continuent de passer par Home Assistant, et c'est très bien.
  # « Les lampes » : celles de la pièce, sans l'anneau du Voice PE que
  # l'ordre intégré emporterait avec la zone. Un intent du dépôt l'emporte sur
  # l'ordre intégré, constaté deux fois dans ce projet.
  LampesOff:
    action:
      - variables:
          cible: >-
            {{ (area_entities(preferred_area_id | default('bedroom')) + (area_entities('kitchen') if (preferred_area_id | default('bedroom')) == 'living_room' else []))
               | select('match', 'light[.]') | reject('search', '_led_ring$')
               | select('has_value') | list }}
      - condition: template
        value_template: "{{ cible | count > 0 }}"
      - service: light.turn_off
        target: { entity_id: "{{ cible }}" }

  LampesOn:
    action:
      - variables:
          cible: >-
            {{ (area_entities(preferred_area_id | default('bedroom')) + (area_entities('kitchen') if (preferred_area_id | default('bedroom')) == 'living_room' else []))
               | select('match', 'light[.]') | reject('search', '_led_ring$')
               | select('has_value') | list }}
      - condition: template
        value_template: "{{ cible | count > 0 }}"
      - service: light.turn_on
        target: { entity_id: "{{ cible }}" }

  # Chaque lampe reprend sa dernière luminosité et sa dernière couleur.
  AllumerTout:
    action:
      - variables:
          cible: >-
            {{ (area_entities(preferred_area_id | default('bedroom')) + (area_entities('kitchen') if (preferred_area_id | default('bedroom')) == 'living_room' else []))
               | select('match', 'light[.]') | reject('search', '_led_ring$')
               | select('has_value') | list }}
      - condition: template
        value_template: "{{ cible | count > 0 }}"
      - service: light.turn_on
        target: { entity_id: "{{ cible }}" }

  # « Lumière 60 ». Les lampes allumées y vont, par lumiere_pas et sa cible
  # absolue — le plancher de 7 % compris. Rien d'allumé, lumiere_pas ne
  # ferait rien : dans une pièce noire, on demande de la lumière, donc toutes
  # ses lampes s'allument à ce niveau. Pas l'anneau du Voice PE, qui n'est pas
  # une lampe.
  LumiereNiveau:
    action:
      - variables:
          piece: "{{ preferred_area_id | default('bedroom') }}"
          lampes: >-
            {{ (area_entities(piece) + (area_entities('kitchen') if (piece) == 'living_room' else [])) | select('match', 'light[.]')
               | reject('search', '_led_ring$') | select('has_value') | list }}
          niveau: "{{ casa_pourcent | default(100) | int(100) }}"
      # Une pièce sans lampe — le salon, tant qu'aucune n'y est rangée — ne
      # fait rien plutôt qu'appeler light.turn_on sans cible.
      - condition: template
        value_template: "{{ lampes | count > 0 }}"
      - if:
          - condition: template
            value_template: "{{ expand(lampes) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
        then:
          - service: script.turn_on
            target: { entity_id: script.lumiere_pas }
            data:
              variables:
                cible: "{{ niveau }}"
                lampe: ""
                piece: "{{ piece }}"
        else:
          - service: light.turn_on
            target: { entity_id: "{{ lampes }}" }
            data:
              brightness_pct: "{{ niveau }}"

  # « Bandeau éteint », « lampes allumées ». Troisième copie de la table des
  # lampes, avec LuminositeLampe et CouleurLampe : une lampe ajoutée l'est
  # dans les trois.
  EtatLampe:
    action:
      - variables:
          lampes:
            bandeau: light.chambre_bandeau
            lampe chambre: light.chambre
          # « les lampes » : celles de la pièce du satellite.
          cible: >-
            {{ [lampes[casa_lampe]] if casa_lampe in lampes else
               (area_entities(preferred_area_id | default('bedroom')) + (area_entities('kitchen') if (preferred_area_id | default('bedroom')) == 'living_room' else []))
               | select('match', 'light[.]') | reject('search', '_led_ring$')
               | select('has_value') | list }}
      - condition: template
        value_template: "{{ cible | count > 0 and casa_etat | default('') in ['allumé', 'éteint'] }}"
      - service: "light.turn_{{ 'on' if casa_etat == 'allumé' else 'off' }}"
        target: { entity_id: "{{ cible }}" }

  CouleurLampe:
    action:
      - variables:
          lampes:
            bandeau: light.chambre_bandeau
            lampe chambre: light.chambre
          # « les lampes » : celles de la pièce du satellite.
          cible: >-
            {{ [lampes[casa_lampe]] if casa_lampe in lampes else
               (area_entities(preferred_area_id | default('bedroom')) + (area_entities('kitchen') if (preferred_area_id | default('bedroom')) == 'living_room' else []))
               | select('match', 'light[.]') | reject('search', '_led_ring$')
               | select('has_value') | list }}
          # `color_name` attend les noms CSS, donc de l'anglais. C'est la
          # seule traduction du dépôt, et elle vit ici plutôt que dans les
          # phrases : là-bas, un `out` anglais casserait la relecture.
          teintes:
            rouge: red
            bleu: blue
            vert: green
            violet: purple
            orange: orange
            jaune: yellow
            rose: pink
            blanc: white
      # Un mot inconnu s'arrête ici plutôt que d'allumer au hasard.
      - condition: template
        value_template: "{{ cible | count > 0 and casa_couleur in teintes }}"
      - service: light.turn_on
        target: { entity_id: "{{ cible }}" }
        data:
          color_name: "{{ teintes[casa_couleur] }}"

  # UNE PIÈCE NOMMÉE (custom_sentences/fr/lumieres.yaml) : la pièce dite, pas
  # celle du satellite. Le mot dit devient une zone par la table ci-dessous ;
  # ses lampes sont celles de la zone, calculées comme partout ailleurs.
  # Une pièce sans lampe le dit, au lieu de se taire : depuis le 17 novembre
  # 2026, la cuisine n'en a plus (ses six lampes sont celles du salon).
  # « maison » (« éteins les lampes partout ») n'est pas une zone : toutes les
  # lampes, sans l'anneau des Voice PE.
  #
  # Une pièce, ce sont les lampes de sa zone ET celles qui portent son mot
  # dans leur nom : les six « led cuisine » sont rangées au salon (novembre
  # 2026), et « éteins lampe cuisine » doit pourtant les éteindre. Le mot est
  # le dernier de la pièce : « bain » pour la salle de bain.
  # Une, deux ou trois pièces d'un coup : « éteins couloir et cuisine »
  # (casa_piece, casa_piece_2, casa_piece_3), éteintes par un seul ordre,
  # donc ensemble. Une pièce sans lampe le dit, sans empêcher les autres.
  PieceEteindre:
    action:
      - variables:
          cible: >-
            {%- set t = {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'} -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for p in [casa_piece, casa_piece_2 | default(''), casa_piece_3 | default('')] if p -%}
              {%- set z = t.get(p, '') -%}
              {%- if z == 'maison' -%}
                {%- set ns.l = ns.l + (states.light | map(attribute='entity_id') | list) -%}
              {%- elif z -%}
                {%- set ns.l = ns.l + (area_entities(z) + (area_entities('kitchen') if (z) == 'living_room' else [])) + (states.light | map(attribute='entity_id') | select('search', p.split(' ') | last) | list) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l | select('match', 'light[.]') | reject('search', '_led_ring$') | select('has_value') | unique | list }}
      - condition: template
        value_template: "{{ cible | count > 0 }}"
      - service: light.turn_off
        target: { entity_id: "{{ cible }}" }
    speech:
      text: >-
        {%- set t = {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'} -%}
        {%- set ns = namespace(m=[]) -%}
        {%- for p in [casa_piece, casa_piece_2 | default(''), casa_piece_3 | default('')] if p -%}
          {%- set z = t.get(p, '') -%}
          {%- set l = (states.light | map(attribute='entity_id') | list) if z == 'maison' else ((area_entities(z) + (area_entities('kitchen') if (z) == 'living_room' else [])) + (states.light | map(attribute='entity_id') | select('search', p.split(' ') | last) | list)) if z else [] -%}
          {%- if l | select('match', 'light[.]') | reject('search', '_led_ring$') | select('has_value') | list | count == 0 -%}
            {%- set ns.m = ns.m + ['Pas de lampe ' ~ ('au ' ~ p if p in ['salon', 'bureau', 'couloir'] else 'dans la ' ~ p) ~ '.'] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.m | join(' ') }}

  # Avec un niveau s'il est dit (« lampes salon 50 »), sinon chaque lampe
  # reprend sa dernière luminosité.
  PieceAllumer:
    action:
      - variables:
          cible: >-
            {%- set t = {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'} -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for p in [casa_piece, casa_piece_2 | default(''), casa_piece_3 | default('')] if p -%}
              {%- set z = t.get(p, '') -%}
              {%- if z == 'maison' -%}
                {%- set ns.l = ns.l + (states.light | map(attribute='entity_id') | list) -%}
              {%- elif z -%}
                {%- set ns.l = ns.l + (area_entities(z) + (area_entities('kitchen') if (z) == 'living_room' else [])) + (states.light | map(attribute='entity_id') | select('search', p.split(' ') | last) | list) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l | select('match', 'light[.]') | reject('search', '_led_ring$') | select('has_value') | unique | list }}
          niveau: "{{ casa_pourcent | default(0) | int(0) }}"
      - condition: template
        value_template: "{{ cible | count > 0 }}"
      - if:
          - condition: template
            value_template: "{{ niveau | int > 0 }}"
        then:
          - service: light.turn_on
            target: { entity_id: "{{ cible }}" }
            data:
              brightness_pct: "{{ niveau }}"
        else:
          - service: light.turn_on
            target: { entity_id: "{{ cible }}" }
    speech:
      text: >-
        {%- set t = {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'} -%}
        {%- set ns = namespace(m=[]) -%}
        {%- for p in [casa_piece, casa_piece_2 | default(''), casa_piece_3 | default('')] if p -%}
          {%- set z = t.get(p, '') -%}
          {%- set l = (states.light | map(attribute='entity_id') | list) if z == 'maison' else ((area_entities(z) + (area_entities('kitchen') if (z) == 'living_room' else [])) + (states.light | map(attribute='entity_id') | select('search', p.split(' ') | last) | list)) if z else [] -%}
          {%- if l | select('match', 'light[.]') | reject('search', '_led_ring$') | select('has_value') | list | count == 0 -%}
            {%- set ns.m = ns.m + ['Pas de lampe ' ~ ('au ' ~ p if p in ['salon', 'bureau', 'couloir'] else 'dans la ' ~ p) ~ '.'] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.m | join(' ') }}

  PieceCouleur:
    action:
      - variables:
          zone: "{{ {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'}.get(casa_piece, '') }}"
          cible: >-
            {{ (states.light | map(attribute='entity_id') | list if zone == 'maison' else (area_entities(zone) + (area_entities('kitchen') if (zone) == 'living_room' else [])) + (states.light | map(attribute='entity_id') | select('search', casa_piece.split(' ') | last) | list)) | select('match', 'light[.]') | reject('search', '_led_ring$')
               | select('has_value') | unique | list if zone else [] }}
          teintes:
            rouge: red
            bleu: blue
            vert: green
            violet: purple
            orange: orange
            jaune: yellow
            rose: pink
            blanc: white
      - condition: template
        value_template: "{{ cible | count > 0 and casa_couleur in teintes }}"
      - service: light.turn_on
        target: { entity_id: "{{ cible }}" }
        data:
          color_name: "{{ teintes[casa_couleur] }}"
    speech:
      text: >-
        {%- set zone = {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'}.get(casa_piece, '') -%}
        {%- if not zone or (states.light | map(attribute='entity_id') | list if zone == 'maison' else (area_entities(zone) + (area_entities('kitchen') if (zone) == 'living_room' else [])) + (states.light | map(attribute='entity_id') | select('search', casa_piece.split(' ') | last) | list)) | select('match', 'light[.]') | reject('search', '_led_ring$') | select('has_value') | unique | list | count == 0 -%}
          Pas de lampe {{ 'au ' ~ casa_piece if casa_piece in ['salon', 'bureau', 'couloir'] else 'dans la ' ~ casa_piece }}.
        {%- endif -%}

  # LES BLANCS, en six paliers de 20 % entre le plus chaud et le plus froid
  # que toutes les lampes de la pièce savent faire (script.lumiere_blanc) :
  #
  #     chaud 0 % · doux 20 % · neutre 40 % · clair 60 % · frais 80 % · froid 100 %
  #
  # « Lampe cuisine chaude », « lumières salon neutres » : toute la pièce à
  # ce palier, lampes éteintes comprises. Sans pièce dite, celle du satellite.
  PieceBlanc:
    action:
      - service: script.lumiere_blanc
        data:
          zone: >-
            {{ {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'}.get(casa_piece | default(''), preferred_area_id | default('bedroom')) }}
          mot: "{{ (casa_piece | default('')).split(' ') | last if casa_piece is defined else '' }}"
          position: "{{ {'chaud': 0, 'doux': 20, 'neutre': 40, 'clair': 60, 'frais': 80, 'froid': 100}.get(casa_blanc, 40) }}"

  # « Plus chaud », « lampes cuisine plus froides », « réchauffe le salon » :
  # un palier de 20 % depuis là où sont les lampes ALLUMÉES, sans en allumer
  # d'autres — comme « augmente la lumière ».
  PieceBlancPas:
    action:
      - service: script.lumiere_blanc
        data:
          zone: >-
            {{ {'cuisine': 'kitchen', 'salon': 'living_room', 'chambre': 'bedroom', 'salle de bain': 'salle_de_bain_principale', 'douche': 'douche', 'bureau': 'bureau', 'couloir': 'couloir', 'maison': 'maison'}.get(casa_piece | default(''), preferred_area_id | default('bedroom')) }}
          mot: "{{ (casa_piece | default('')).split(' ') | last if casa_piece is defined else '' }}"
          pas: "{{ -20 if casa_sens == 'chaud' else 20 }}"
