# Ce que la voix fait des lampes au-delà des ordres intégrés. Les phrases sont
# dans custom_sentences/fr/lumieres.yaml, qui dit ce qui manquait et pourquoi.
#
# Les scripts vivent ICI plutôt que dans scripts.yaml. Un package porte sa
# fonction entière, comme le réveil et la météo, et cela évite de toucher un
# fichier que d'autres modifient au même moment.
#
# Les quatre lampes sont nommées en toutes lettres. C'est volontaire : viser
# la zone du satellite ferait dépendre l'ordre de l'endroit où l'on parle, et
# `light.turn_off` sur `all` emporterait aussi l'anneau lumineux du Voice PE,
# qui n'est pas un éclairage de la pièce.

# « Les lampes de la chambre », ce sont les deux LED et elles seules.
#
# Le groupe leur donne un destinataire unique, et il vit dans le dépôt plutôt
# que dans le registre : contrairement aux alias, il survit à une
# réinstallation. La forme `platform: group` est toujours vivante en 2026.9,
# vérifié dans le composant lui-même — ce dépôt s'est déjà fait surprendre
# deux fois par des formes YAML retirées en silence.
light:
  - platform: group
    name: Lampes chambre
    unique_id: casa_lampes_chambre
    entities:
      - light.chambre_wiz_1
      - light.chambre_wiz_2

script:
  # Un pas de luminosité, vers le haut ou vers le bas.
  #
  # Seules les lampes ALLUMÉES bougent. Sans ce filtre, un pas positif
  # rallumerait les lampes éteintes : `brightness_step_pct` sur une lampe
  # éteinte l'allume au niveau du pas. « Augmente la luminosité » doit
  # éclaircir la pièce telle qu'elle est, pas la rallumer entière.
  lumiere_pas:
    alias: Lumières · un pas de luminosité
    icon: mdi:brightness-6
    mode: restart
    fields:
      pas:
        description: Le pas en pourcent, négatif pour baisser
        example: 10
    variables:
      allumees: >-
        {{ expand('light.chambre', 'light.chambre_bandeau',
                  'light.chambre_wiz_1', 'light.chambre_wiz_2')
           | selectattr('state', 'eq', 'on')
           | map(attribute='entity_id') | list }}
    sequence:
      # Rien d'allumé : on s'arrête sans erreur et sans un mot. La pièce est
      # noire, la personne le voit.
      - condition: template
        value_template: "{{ allumees | count > 0 }}"
      - service: light.turn_on
        target: { entity_id: "{{ allumees }}" }
        data:
          brightness_step_pct: "{{ pas | int(10) }}"

  # Tout éteindre sauf le bandeau, qui reste comme veilleuse.
  #
  # L'ordre intégré ne sait pas faire d'exception : il n'a pas de notion de
  # « sauf ». D'où cette liste explicite des trois autres lampes. Une lampe
  # ajoutée à la chambre devra être ajoutée ici, et c'est le prix de la
  # précision — une zone entière emporterait l'anneau du satellite.
  eteindre_sauf_bandeau:
    alias: Lumières · tout sauf le bandeau
    icon: mdi:lightbulb-night
    sequence:
      - service: light.turn_off
        target:
          entity_id:
            - light.chambre
            - light.chambre_wiz_1
            - light.chambre_wiz_2

# Aucun `speech` nulle part : l'assistant ne confirme pas ce qui se voit. La
# règle du dépôt, posée le 22 septembre 2026, vaut ici comme pour les
# ambiances et la musique.
intent_script:
  EteindreSaufBandeau:
    action:
      - service: script.turn_on
        target: { entity_id: script.eteindre_sauf_bandeau }

  LuminositePlus:
    action:
      - service: script.turn_on
        target: { entity_id: script.lumiere_pas }
        data:
          variables:
            pas: 10

  LuminositeMoins:
    action:
      - service: script.turn_on
        target: { entity_id: script.lumiere_pas }
        data:
          variables:
            pas: -10

  # « Mets le bandeau en rouge ». Deux traductions, parce que la phrase arrive
  # en français des deux côtés : le mot de la lampe vers son entity_id, et le
  # mot de la couleur vers le nom anglais qu'attend `color_name`.
  #
  # Pourquoi ne pas laisser faire l'ordre intégré, qui sait déjà poser une
  # couleur : parce qu'il ne connaît que les verbes « allume » et « règle »
  # côté micro. Ce bloc n'existe que pour le verbe « mets ». Les deux autres
  # tournures continuent de passer par Home Assistant, et c'est très bien.
  # « Les lampes de la chambre » désigne le groupe, pas la pièce entière.
  #
  # Home Assistant lit déjà cette phrase, mais comme un ordre sur toute la
  # zone : il emporterait le bandeau et jusqu'à l'anneau lumineux du Voice PE.
  # Ces deux intents détournent donc la phrase vers le groupe. Un intent du
  # dépôt l'emporte sur l'ordre intégré, constaté deux fois dans ce projet.
  LampesChambreOff:
    action:
      - service: light.turn_off
        target: { entity_id: light.lampes_chambre }

  LampesChambreOn:
    action:
      - service: light.turn_on
        target: { entity_id: light.lampes_chambre }

  CouleurLampe:
    action:
      - variables:
          lampes:
            bandeau: light.chambre_bandeau
            led droite: light.chambre_wiz_1
            led gauche: light.chambre_wiz_2
            lampe chambre: light.chambre
            les lampes: light.lampes_chambre
          # `color_name` attend les noms CSS, donc de l'anglais. C'est la
          # seule traduction du dépôt, et elle vit ici plutôt que dans les
          # phrases : là-bas, un `out` anglais casserait la relecture.
          teintes:
            rouge: red
            bleu: blue
            vert: green
            violet: purple
            orange: orange
            jaune: yellow
            rose: pink
            blanc: white
      # Un mot inconnu s'arrête ici plutôt que d'allumer au hasard.
      - condition: template
        value_template: "{{ casa_lampe in lampes and casa_couleur in teintes }}"
      - service: light.turn_on
        target: { entity_id: "{{ lampes[casa_lampe] }}" }
        data:
          color_name: "{{ teintes[casa_couleur] }}"
