# Ce que la voix fait de la musique. Les phrases sont dans
# custom_sentences/fr/musique.yaml, qui explique pourquoi elles existent :
# Speech-to-Phrase ne sait pas transcrire « éteins la musique », alors que
# Home Assistant saurait la comprendre.
#
# CHAQUE PIÈCE A SON ENCEINTE. Depuis le déménagement de novembre 2026, il y a
# une WiiM et un Voice PE dans la chambre, une WiiM et un Voice PE dans le
# salon. « Arrête la musique » vise l'enceinte de la pièce du satellite qui a
# entendu : Home Assistant passe sa zone dans le slot `preferred_area_id`
# (voir packages/lumieres.yaml). Sans satellite — l'app, le clavier —, c'est
# la chambre.
#
# La table est répétée dans chaque intent, à l'identique :
#
#     {'living_room': 'media_player.ma_salon'}.get(preferred_area_id | default(''),
#                                                  'media_player.ma_chambre')
#
# Une pièce absente de la table retombe sur la chambre. Une enceinte ajoutée
# ailleurs s'y ajoute, dans les quatre intents.
#
# Les entity_id viennent de Music Assistant, renommés sur le Pi le 17
# novembre 2026 : `media_player.ma_chambre` est la WiiM de la chambre (avant
# le déménagement, ce nom désignait celle qui est aujourd'hui au salon) et
# `media_player.ma_salon` celle du salon. Le renommage vit dans le registre de
# Home Assistant, pas dans le dépôt : une installation neuve doit le refaire.
#
# « Éteindre » fait une PAUSE, pas un arrêt. Le résultat est le même pour
# l'oreille, mais la file de lecture survit, et « remets la musique » reprend
# où l'on en était. Un vrai `media_stop` la viderait.
#
# Chaque intent répond même quand l'enceinte est absente, plutôt que
# d'échouer en silence : un assistant doit dire ce qui manque. C'est aussi ce
# qui permet à dev/verifier.py de les vérifier sans enceinte.

intent_script:
  ArreterMusique:
    action:
      - variables:
          e: >-
            {{ {'living_room': 'media_player.ma_salon'}.get(preferred_area_id | default(''),
                                                           'media_player.ma_chambre') }}
      - if:
          - condition: template
            value_template: "{{ states(e) not in ['unknown', 'unavailable'] }}"
        then:
          - service: media_player.media_pause
            target: { entity_id: "{{ e }}" }
    speech:
      text: >-
        {%- set e = {'living_room': 'media_player.ma_salon'}.get(preferred_area_id | default(''), 'media_player.ma_chambre') -%}
        {%- if states(e) in ['unknown', 'unavailable'] -%}
          L'enceinte ne répond pas.
        {%- endif -%}

  ReprendreMusique:
    action:
      - variables:
          e: >-
            {{ {'living_room': 'media_player.ma_salon'}.get(preferred_area_id | default(''),
                                                           'media_player.ma_chambre') }}
      - if:
          - condition: template
            value_template: "{{ states(e) not in ['unknown', 'unavailable'] }}"
        then:
          - service: media_player.media_play
            target: { entity_id: "{{ e }}" }
    speech:
      text: >-
        {%- set e = {'living_room': 'media_player.ma_salon'}.get(preferred_area_id | default(''), 'media_player.ma_chambre') -%}
        {%- if states(e) in ['unknown', 'unavailable'] -%}
          L'enceinte ne répond pas.
        {%- endif -%}

  MusiqueSuivante:
    action:
      - variables:
          e: >-
            {{ {'living_room': 'media_player.ma_salon'}.get(preferred_area_id | default(''),
                                                           'media_player.ma_chambre') }}
      - if:
          - condition: template
            value_template: "{{ states(e) not in ['unknown', 'unavailable'] }}"
        then:
          - service: media_player.media_next_track
            target: { entity_id: "{{ e }}" }
    speech:
      text: >-
        {%- set e = {'living_room': 'media_player.ma_salon'}.get(preferred_area_id | default(''), 'media_player.ma_chambre') -%}
        {%- if states(e) in ['unknown', 'unavailable'] -%}
          L'enceinte ne répond pas.
        {%- endif -%}

  # « Qu'est-ce qui joue ? » Ce que l'enceinte dit elle-même : le titre et
  # l'artiste du morceau, jamais la playlist.
  QuiJoue:
    speech:
      text: >-
        {%- set e = {'living_room': 'media_player.ma_salon'}.get(preferred_area_id | default(''), 'media_player.ma_chambre') -%}
        {%- set titre = state_attr(e, 'media_title') -%}
        {%- set artiste = state_attr(e, 'media_artist') -%}
        {%- if states(e) in ['unknown', 'unavailable'] -%}
          L'enceinte ne répond pas.
        {%- elif not is_state(e, 'playing') or not titre -%}
          Rien ne joue en ce moment.
        {%- else -%}
          C'est {{ titre }}{{ ', de ' ~ artiste if artiste else '' }}.
        {%- endif -%}
