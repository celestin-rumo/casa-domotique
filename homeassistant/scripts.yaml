# UNE SEULE PIÈCE : LA CHAMBRE, et une seule enceinte, la WiiM Sound Lite
# renommée `media_player.ma_chambre` dans Music Assistant. D'où l'absence de
# tout `media_player.join` : il n'y a personne à grouper. Les ambiances
# multi-pièces et Cinéma reviendront avec le matériel — la version qui les
# porte est dans l'historique git, commit ccb9f08 et avant.

# La seule table nom -> URI. Les ambiances l'appellent au lieu de porter
# chacune son adresse, et l'app appelle ce script avec le nom choisi.
# Les mêmes noms sont proposés dans input_selects.yaml.
#
# `name` accepte aussi une adresse, jouée telle quelle : une URI Spotify
# (spotify:playlist:…), le lien que donne Spotify > Partager > Copier le lien,
# ou une playlist de la bibliothèque de Music Assistant (library://playlist/83).
# C'est ce qui permet de taper n'importe quelle playlist dans les réglages
# d'une ambiance ou du réveil, depuis Home Assistant, sans toucher à la table.
play_playlist:
  alias: Jouer une playlist
  mode: restart
  fields:
    name:
      description: Un nom de input_select.playlist, ou l'adresse d'une playlist
      example: Détente
    player:
      description: L'enceinte qui joue
      example: media_player.ma_chambre
    radio_mode:
      description: Se servir de la playlist comme graine plutôt que la jouer telle quelle
      example: false
  variables:
    playlists:
      Détente: "spotify:playlist:37i9dQZF1DX4sWSpwq3LiO"
      Chillos: "spotify:playlist:0mQbGXAlmsI3T2Vyfa0IVd"
      # Spotify > la playlist > Partager > Copier le lien, puis garder le seul
      # identifiant : le ?si= du lien copié est un jeton de partage lié au
      # compte, il n'a rien à faire ici.
      Focus: "spotify:playlist:37i9dQZF1DWWQRwui0ExPn"
    choix: "{{ name | default('') | trim }}"
    # Le lien de partage est ramené à son URI : son ?si= est un jeton lié au
    # compte, que Music Assistant n'a pas à recevoir.
    media_id: >-
      {%- set lien = choix | regex_findall('open[.]spotify[.]com/(?:intl-[a-z-]+/)?playlist/([A-Za-z0-9]+)') -%}
      {%- if choix in playlists -%}{{ playlists[choix] }}
      {%- elif lien -%}spotify:playlist:{{ lien[0] }}
      {%- elif '://' in choix or choix.startswith('spotify:') -%}{{ choix }}
      {%- endif -%}
  sequence:
    # Ce qui ne se résout pas échoue, et le dit, plutôt que d'envoyer un
    # media_id vide. Une faute de frappe dans le réglage d'une ambiance la
    # fait donc échouer : pas d'écho, et l'app le signale au lieu de montrer
    # une ambiance confirmée qui ne joue rien.
    - if:
        - condition: template
          value_template: "{{ media_id == '' }}"
      then:
        - stop: "Playlist introuvable : ni un nom de la table, ni une adresse"
          error: true
    - service: music_assistant.play_media
      target: { entity_id: "{{ player }}" }
      data:
        media_id: "{{ media_id }}"
        media_type: playlist
        radio_mode: "{{ radio_mode | default(false) }}"
    # Ce qui joue, nom ou adresse, pour l'écran Écoute : l'enceinte ne dit que
    # le morceau, jamais la playlist (packages/playlists.yaml). Un Pi qui n'a
    # pas encore redémarré depuis l'ajout de ce réglage joue quand même.
    - service: input_text.set_value
      target: { entity_id: input_text.playlist_courante }
      data: { value: "{{ choix }}" }
      continue_on_error: true
    # C'est cet écho qui confirme le choix côté app, pas la réponse au service.
    # Une adresse n'a pas de nom dans input_select.playlist : pas d'écho.
    - if:
        - condition: template
          value_template: "{{ choix in playlists }}"
      then:
        - service: input_select.select_option
          target: { entity_id: input_select.playlist }
          data: { option: "{{ choix }}" }

# LA MUSIQUE DES AMBIANCES SE RÈGLE DANS HOME ASSISTANT, pas ici. Chaque
# ambiance lit son input_text (packages/ambiances.yaml) : un nom de la table
# ci-dessus, une adresse, ou « aucune » pour laisser la musique telle
# quelle. Vide, elle joue `defaut`. Même partage que pour les scènes : ce
# qu'on joue est du goût, et se change sans commit ; l'ordre des étapes et
# l'écho restent de la logique, ici.
mood_detente:
  alias: Mood Détente
  variables:
    reglage: input_text.musique_detente
    defaut: Détente
    # La playlist par défaut sert de graine, et la lecture part ailleurs
    # après quelques titres. Une playlist choisie dans le réglage, elle, se
    # joue telle quelle.
    radio: true
    # Le volume : son réglage (packages/ambiances.yaml), ou, jamais réglé,
    # celui d'avant ces réglages.
    volume: input_number.volume_detente
    volume_defaut: 25
  sequence:
    - service: scene.turn_on
      target: { entity_id: scene.detente }
    # Le volume AVANT la musique, pour qu'elle ne démarre pas au volume de
    # l'ambiance d'avant. Réglé, ou `volume_defaut`, et jamais au-dessus du
    # plafond de la WiiM (packages/son.yaml) — un Pi qui n'a pas encore
    # redémarré depuis l'ajout de ces réglages lit « unknown », donc 0 : le
    # défaut, sans plafond, comme avant.
    - &volume_regle
      service: media_player.volume_set
      target: { entity_id: media_player.ma_chambre }
      data:
        volume_level: >-
          {%- set r = states(volume) | float(0) -%}
          {%- set v = r if r > 0 else volume_defaut | float -%}
          {%- set m = states('input_number.volume_max') | float(0) -%}
          {%- set v = [v, m] | min if m > 0 else v -%}
          {{ (v / 100) | round(2) }}
    # Une étape groupée, pour que l'ancre la réutilise d'un bloc dans les
    # quatre ambiances : chacune ne donne que `reglage` et `defaut`.
    - &musique_reglee
      sequence:
        - variables:
            brut: "{{ states(reglage) | trim }}"
            reglee: "{{ brut not in ['', 'unknown', 'unavailable'] }}"
            choix: "{{ brut if reglee else defaut }}"
        - if:
            - condition: template
              value_template: "{{ choix | lower != 'aucune' }}"
          then:
            - service: script.play_playlist
              data:
                name: "{{ choix }}"
                player: media_player.ma_chambre
                radio_mode: "{{ radio | default(false) and not reglee }}"
    # L'écho qui confirme l'ambiance côté app, comme play_playlist écrit
    # input_select.playlist. En dernier, donc absent si une étape a échoué :
    # l'app revient alors en arrière en nommant le script. `this` est le
    # script lui-même, d'où une étape identique dans les quatre ambiances —
    # l'ancre YAML ci-dessous la réutilise sans rien recopier.
    - &ambiance_confirmee
      service: input_select.select_option
      target: { entity_id: input_select.mood }
      data: { option: "{{ this.entity_id }}" }

mood_focus:
  alias: Mood Focus
  # pas de radio : la playlist se joue telle quelle
  variables:
    reglage: input_text.musique_focus
    defaut: Focus
    volume: input_number.volume_focus
    volume_defaut: 15
  sequence:
    - service: scene.turn_on
      target: { entity_id: scene.focus }
    - *volume_regle
    - *musique_reglee
    - *ambiance_confirmee

mood_chillos:
  alias: Mood Chillos
  # pas de radio : une playlist choisie se joue telle quelle
  variables:
    reglage: input_text.musique_chillos
    defaut: Chillos
    volume: input_number.volume_chillos
    volume_defaut: 18
  sequence:
    - service: scene.turn_on
      target: { entity_id: scene.chillos }
    - *volume_regle
    - *musique_reglee
    - *ambiance_confirmee

mood_calin:
  alias: Mood Câlin
  variables:
    reglage: input_text.musique_calin
    defaut: Chillos
    volume: input_number.volume_calin
    volume_defaut: 15
  sequence:
    - service: scene.turn_on
      target: { entity_id: scene.calin }
    - *volume_regle
    - *musique_reglee
    - *ambiance_confirmee

mood_off:
  alias: Tout éteindre
  sequence:
    - service: scene.turn_on
      target: { entity_id: scene.tout_eteindre }
    # Toutes les lumières, pas seulement celles de la scène. scene.tout_eteindre
    # appartient à Home Assistant et ne connaît que ce qu'on y a mis : les deux
    # WiZ, ajoutées à la chambre après coup, n'y étaient pas, et Tout éteindre
    # les laissait allumées. Même logique que media_stop juste en dessous.
    - service: light.turn_off
      target: { entity_id: all }
    - service: media_player.media_stop
      target: { entity_id: all }
    - *ambiance_confirmee

# LES AMBIANCES AJOUTÉES DEPUIS L'APP : six places, une par script, qui
# lisent tout de leur input_text.ambiance_perso_N (packages/ambiances.yaml) :
# le nom, la musique, le volume. Les lumières sont la scène d'identifiant
# `ambiance_perso_N`, que l'app écrit comme les autres — cherchée par cet
# identifiant, pas par un entity_id que Home Assistant tire du nom.
#
# Même ordre que les ambiances d'origine, même écho en dernier. Une place
# vide échoue et le dit : l'app ne la montre pas, mais « Je suis debout » ou
# Outils de développement peuvent encore la lancer.
mood_perso_1:
  alias: Ambiance perso 1
  variables: { place: 1 }
  sequence: &ambiance_perso
    - variables:
        brut: "{{ states('input_text.ambiance_perso_' ~ place) | trim }}"
        reglage: "{{ brut | from_json if brut.startswith('{') else {} }}"
    - if:
        - condition: template
          value_template: "{{ reglage.n is not defined }}"
      then:
        - stop: "Cette place est vide : aucune ambiance n'y est enregistrée"
          error: true
    - variables:
        scene: >-
          {{ states.scene | selectattr('attributes.id', 'defined')
             | selectattr('attributes.id', 'eq', 'ambiance_perso_' ~ place)
             | map(attribute='entity_id') | first | default('') }}
        choix: "{{ reglage.m | default('') | string | trim }}"
        volume: "{{ reglage.v | default(0) | float(0) }}"
    - if:
        - condition: template
          value_template: "{{ scene != '' }}"
      then:
        - service: scene.turn_on
          target: { entity_id: "{{ scene }}" }
    - if:
        - condition: template
          value_template: "{{ volume > 0 }}"
      then:
        - service: media_player.volume_set
          target: { entity_id: media_player.ma_chambre }
          data:
            volume_level: >-
              {%- set m = states('input_number.volume_max') | float(0) -%}
              {%- set v = [volume, m] | min if m > 0 else volume -%}
              {{ (v / 100) | round(2) }}
    - if:
        - condition: template
          value_template: "{{ choix not in ['', 'aucune'] }}"
      then:
        - service: script.play_playlist
          data:
            name: "{{ choix }}"
            player: media_player.ma_chambre
    - service: input_select.select_option
      target: { entity_id: input_select.mood }
      data: { option: "{{ this.entity_id }}" }
mood_perso_2: { alias: Ambiance perso 2, variables: { place: 2 }, sequence: *ambiance_perso }
mood_perso_3: { alias: Ambiance perso 3, variables: { place: 3 }, sequence: *ambiance_perso }
mood_perso_4: { alias: Ambiance perso 4, variables: { place: 4 }, sequence: *ambiance_perso }
mood_perso_5: { alias: Ambiance perso 5, variables: { place: 5 }, sequence: *ambiance_perso }
mood_perso_6: { alias: Ambiance perso 6, variables: { place: 6 }, sequence: *ambiance_perso }

# Un banc d'essai, pas une ambiance : les lampes et la playlist Chillos sans
# passer par une scène ni par play_playlist, pour qu'une panne accuse le
# matériel et jamais une scène retouchée dans l'interface. Pas d'écho vers
# input_select.mood, donc l'app ne le connaît pas.
test_lampes_musique:
  alias: Test lampes + musique
  icon: mdi:lamp
  mode: restart
  sequence:
    - service: light.turn_on
      target: { entity_id: light.chambre }
      data: { brightness: 8, color_temp_kelvin: 2200, transition: 2 }
    - service: light.turn_on
      target: { entity_id: light.chambre_bandeau }
      data: { brightness: 40, rgb_color: [255, 30, 70], transition: 2 }
    # Le volume avant la musique, pour qu'elle ne démarre pas fort.
    - service: media_player.volume_set
      target: { entity_id: media_player.ma_chambre }
      data: { volume_level: 0.18 }
    # L'aléatoire avant la lecture : Music Assistant mélange la file au
    # chargement, premier morceau compris. Après, seule la suite le serait.
    # Le réglage reste sur l'enceinte — les ambiances en héritent ensuite.
    - service: media_player.shuffle_set
      target: { entity_id: media_player.ma_chambre }
      data: { shuffle: true }
    - service: music_assistant.play_media
      target: { entity_id: media_player.ma_chambre }
      data:
        media_id: "spotify:playlist:0mQbGXAlmsI3T2Vyfa0IVd"
        media_type: playlist
