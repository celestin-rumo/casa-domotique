mood_cinema:
  alias: Mood Cinéma
  sequence:
    - service: scene.turn_on
      target: { entity_id: scene.cinema }
    - service: media_player.select_source
      target: { entity_id: media_player.sonos_beam }
      data: { source: TV }

mood_detente:
  alias: Mood Détente
  sequence:
    - service: scene.turn_on
      target: { entity_id: scene.detente }
    - service: media_player.join
      target: { entity_id: media_player.ma_salon }
      data: { group_members: [media_player.ma_cuisine] }
    - service: music_assistant.play_media
      target: { entity_id: media_player.ma_salon }
      data:
        media_id: "spotify:playlist:37i9dQZF1DX4sWSpwq3LiO"
        media_type: playlist
        radio_mode: true
    - service: media_player.volume_set
      target: { entity_id: media_player.ma_salon }
      data: { volume_level: 0.25 }

mood_off:
  alias: Tout éteindre
  sequence:
    - service: scene.turn_on
      target: { entity_id: scene.tout_eteindre }
    - service: media_player.media_stop
      target: { entity_id: all }
