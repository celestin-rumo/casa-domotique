# Lancer une ambiance à la voix. L'intent est traité par intent_script dans
# packages/ambiances.yaml, qui tient le tableau mot → script.
#
# La liste casa_ambiance ramène chaque tournure (in) à un mot (out). Le
# mot, et pas l'entity_id, pour une raison précise : Speech-to-Phrase
# transcrit la valeur « out », et Home Assistant relit cette transcription
# comme une phrase. « script.mood_calin » ne se relit pas ; « câlin » oui,
# puisque c'est aussi une entrée de la liste. Plusieurs tournures peuvent
# donner le même mot ; c'est ici qu'on les ajoute.
language: "fr"

intents:
  LancerAmbiance:
    data:
      - sentences:
          # « dans la chambre » est accepté et ne change rien : les ambiances
          # sont celles de la chambre, d'où qu'on les lance (novembre 2026).
          - "(mets|lance|passe|passe en|active) [le mode|l'ambiance|mode|ambiance] {casa_ambiance} [(dans|à|de) [la] chambre]"
          - "[le ]mode {casa_ambiance} [(dans|à|de) [la] chambre]"
          - "ambiance {casa_ambiance} [(dans|à|de) [la] chambre]"
      # Les tournures qui sont une ambiance à elles seules.
      - sentences:
          - "{casa_ambiance}"
          - "{casa_ambiance} (dans|à) [la] chambre"

  # Les ambiances d'UNE pièce : ses scènes, trouvées par un mot de leur nom
  # (packages/ambiances.yaml). La pièce est facultative : sans elle, c'est
  # celle du satellite qui a entendu.
  AmbiancePiece:
    data:
      - sentences:
          - "(mets|mettre|lance|lancer|passe|active) [l'ambiance|ambiance|la scène|scène] {casa_scene} [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(ambiance|scène) {casa_scene} [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "{casa_scene} [(dans|à|au)] [la|le|l'] {casa_piece}"
      # « Tamisé » seul est l'ordre de tamiser (lumieres.yaml), qui marche
      # partout. Précédé d'« ambiance », c'est la scène de ce nom — « douche
      # tamisé », « Tamisé film » au salon. Le mot est donc fixé ici plutôt
      # que mis dans casa_scene, où il se battrait avec le tamisage.
      - sentences:
          - "(mets|mettre|lance|lancer|active) (l'ambiance|ambiance|la scène|scène) (tamisé|tamisée) [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(ambiance|scène) (tamisé|tamisée) [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
        slots:
          casa_scene: "tamisé"

lists:
  # Un mot cherché dans le nom des scènes de la pièce ; out est ce mot-là.
  # Pour qu'une nouvelle ambiance réponde à la voix, lui donner un nom qui en
  # contient un — ou ajouter ici le mot de son nom.
  casa_scene:
    values:
      - in: "(normal|normale)"
        out: "normal"
      - in: "chill"
        out: "chill"
      - in: "film"
        out: "film"
      - in: "(sexy|sexy rose|bain sexy)"
        out: "sexy"
      - in: "(nightly|nuit)"
        out: "nightly"
      # « lumière chaude » n'en est plus : c'est le blanc chaud de toute la
      # pièce (PieceBlanc, lumieres.yaml).
      - in: "(light|lights)"
        out: "light"

  casa_ambiance:
    values:
      # « cinéma » reviendra avec la TV : le mot ne sert à rien tant que
      # script.mood_cinema n'existe pas, et packages/ambiances.yaml
      # répondrait qu'il ne connaît pas l'ambiance.
      - in: "détente"
        out: "détente"
      - in: "focus"
        out: "focus"
      - in: "chillos"
        out: "chillos"
      - in: "câlin"
        out: "câlin"
      - in: "(donne-moi|donne moi|donne-lui|donne lui|donne nous|donne-nous) envie de faire (du sexe|l'amour)"
        out: "câlin"
      - in: "on se fait un câlin"
        out: "câlin"
      # « Tout éteindre » coupe les lumières ET la musique : script.mood_off
      # fait un light.turn_off et un media_stop sur `all`, pas seulement sur
      # ce que la scène connaît. C'est donc la phrase à dire pour arrêter la
      # maison d'un coup, et elle mérite toutes ses tournures.
      - in: "tout éteindre"
        out: "tout éteindre"
      - in: "(éteins|éteindre) tout"
        out: "tout éteindre"
      - in: "(arrête|arrete|arrêter|arreter|stop|stoppe|coupe|couper) tout"
        out: "tout éteindre"
      - in: "(éteins|coupe) (tout|la maison)"
        out: "tout éteindre"
