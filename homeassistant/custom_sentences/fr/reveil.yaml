# Les phrases qu'Assist comprend pour le réveil. Chaque intent est traité
# par intent_script dans packages/reveil.yaml.
#
# Syntaxe : (a|b) = l'un ou l'autre, [c] = facultatif, {x} = une liste.
# Les listes « range » acceptent les nombres dits en toutes lettres :
# « sept heures trente » donne reveil_heure=7, reveil_minutes=30.
#
# Ce dossier est lu par deux programmes : Home Assistant, qui y trouve ce
# que chaque phrase déclenche, et Speech-to-Phrase, qui y apprend ce qu'il
# doit savoir entendre — même format, même fichier. Les listes portent un
# préfixe pour ne pas écraser celles que Speech-to-Phrase partage entre
# toutes les langues (minutes, hours…).
#
# Ce fichier doit être dans /config/custom_sentences/fr/ — pas ailleurs.
# Sur le poste de dev, le compose l'y monte ; sur le Pi, c'est le dossier
# homeassistant/ entier qui devient /config.
language: "fr"

intents:
  ReglerReveil:
    data:
      # Trois façons de dire l'heure : « sept heures trente » à l'oral,
      # « 7h30 » et « 7 h 30 » tels que whisper les écrit. Speech-to-Phrase
      # sort toujours des chiffres et le mot « heures ».
      - sentences:
          #
          # « met » sans s et « 7heures » collé : c'est ce que whisper écrit
          # parfois, et sans eux la phrase partait en commande de lumière
          # (HassLightSet), vérifié sur le Pi le 4 octobre 2026.
          - "(règle|mets|met|programme) [le] réveil [demain] (à|pour) {reveil_heure} [heure|heures] [{reveil_minutes}]"
          - "(règle|mets|met|programme) [le] réveil [demain] (à|pour) {reveil_heure}(heure|heures) [{reveil_minutes}]"
          - "(règle|mets|met|programme) [le] réveil [demain] (à|pour) {reveil_heure}[ ]h[ ][{reveil_minutes}]"
          - "(réveille-moi|réveille moi|réveil-moi) [(à|pour)] {reveil_heure} [heure|heures] [{reveil_minutes}]"
          - "(réveille-moi|réveille moi|réveil-moi) [(à|pour)] {reveil_heure}[ ]h[ ][{reveil_minutes}]"
          - "réveil (à|pour) {reveil_heure} [heure|heures] [{reveil_minutes}]"
  ActiverReveil:
    data:
      - sentences:
          - "(active|allume|remets|réactive) [le] réveil [(de|pour) demain] [matin]"
  DesactiverReveil:
    data:
      - sentences:
          # « pour demain » est dit souvent, et sans lui la phrase partait
          # ailleurs : « désactive le réveil pour demain » en aspirateur
          # (HassVacuumReturnToBase), « annule le réveil de demain » en liste
          # de courses — vérifié sur le Pi le 4 octobre 2026.
          - "(désactive|enlève|coupe|annule|supprime) [le] réveil [(de|pour) demain] [matin]"
          - "pas de réveil [demain] [matin]"
  ArreterReveil:
    data:
      - sentences:
          - "(arrête|stop|stoppe) [le] réveil"
          - "[c'est bon[,] ]je suis (debout|réveillé|réveillée|levé|levée)"
          - "[c'est bon[,] |ok[,] ]je me lève"

  # Encore cinq ou dix minutes : le bonjour recule d'autant
  # (script.reveil_prolonger).
  ProlongerReveil:
    data:
      - sentences:
          - "encore {reveil_prolonge} minutes"
          - "(prolonge|repousse) [le réveil] [de] {reveil_prolonge} minutes"
          - "(laisse-moi|laisse moi) [encore] {reveil_prolonge} minutes"

lists:
  reveil_prolonge:
    range:
      type: number
      from: 5
      to: 10
      step: 5
  reveil_heure:
    range:
      type: number
      from: 0
      to: 23
  reveil_minutes:
    range:
      type: number
      from: 1
      to: 59
