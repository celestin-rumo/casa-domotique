# Ce que la voix sait faire des lampes en plus des ordres intégrés. Les
# intents sont traités par intent_script dans packages/lumieres.yaml.
#
# CE QUI EST DÉJÀ COUVERT, ET QU'ON N'AJOUTE DONC PAS :
#
#   allumer, éteindre          « éteins les lumières », « allume la chambre »
#   une luminosité ABSOLUE     « règle la luminosité à 50 pourcent »
#   une COULEUR                « allume le bandeau en rouge »
#                              « règle les lumières en bleu »
#
# Les redéclarer créerait deux intents candidats pour une même phrase, et
# rien ne dirait lequel gagne.
#
# CE QUI MANQUE, ET QUI EST ICI :
#
#   - éteindre tout SAUF une lampe. L'ordre intégré ne sait pas faire
#     d'exception : « éteins les lumières sauf le bandeau » est compris comme
#     « éteins les lumières », et le bandeau s'éteint avec les autres ;
#   - la luminosité RELATIVE. Rien dans le vocabulaire de Speech-to-Phrase ne
#     monte ni ne baisse la lumière par tranches, vérifié le 22 septembre 2026
#     dans sa grammaire française.
#
# « Baisse la luminosité » mérite une mention : sans ce fichier, Home
# Assistant la comprenait comme un HassTurnOff, donc une extinction complète
# au lieu d'une baisse. Ces phrases corrigent ce contresens plutôt qu'elles
# n'ajoutent une fonction.
#
# SANS VERBE. Chaque ordre se dit aussi par le nom seul, suivi de ce qu'on
# veut : « bandeau cent », « bandeau rouge », « lampes éteintes », « bandeau
# plus ». Ce sont les mêmes intents que les phrases à verbe ; seules les
# tournures s'ajoutent. hassil exige que la phrase entière soit couverte :
# « bandeau » seul ne correspond donc à rien, et ne fait rien.
language: "fr"

intents:
  EteindreSaufBandeau:
    data:
      - sentences:
          - "(éteins|éteindre|coupe|couper) (les lumières|les lampes|toutes les lumières|toutes les lampes|tout) sauf (le bandeau|le flux gradient|le gradient)"
          - "(éteins|coupe) tout sauf (le bandeau|le flux gradient|le gradient)"
          - "(garde|laisse) (le bandeau|le flux gradient) [allumé] et (éteins|coupe) le reste"
          # Dit à l'envers : ce qu'on garde plutôt que ce qu'on éteint. Avec
          # et sans le « ne », parce que personne ne le prononce à l'oral.
          - "[ne] (garde|garder|laisse|laisser) que (le bandeau|le flux gradient|le gradient)"
          - "(garde|garder|laisse|laisser) (seulement|uniquement) (le bandeau|le flux gradient|le gradient)"
          - "(juste|seulement|uniquement) (le bandeau|le flux gradient|le gradient)"

  # L'article est FACULTATIF partout : à l'oral on dit « baisse luminosité »
  # aussi souvent que « baisse la luminosité », et la phrase sans article ne
  # correspondait à rien.
  # Chaque pas se dit avec ou sans lampe. Sans lampe, il porte sur tout ce
  # qui est allumé ; avec, sur elle seule.
  #
  # Les deux ordres de mots sont acceptés, « augmente bandeau luminosité »
  # comme « augmente la luminosité du bandeau » : à l'oral on place le nom là
  # où il vient. Sans la première forme, le micro entendait « augmente
  # luminosité » et perdait le mot de la lampe en chemin, faute de tournure
  # qui l'accueille — constaté le 23 septembre 2026.
  LuminositePlus:
    data:
      - sentences:
          - "(augmente|augmenter|monte|monter) [la] (luminosité|lumière)"
          - "plus de lumière"
          - "(éclaire|éclairer) plus"
          - "(augmente|augmenter|monte|monter) {casa_lampe} [la] (luminosité|lumière)"
          - "(augmente|augmenter|monte|monter) [la] (luminosité|lumière) (de|du|de la|des) {casa_lampe}"
          - "(augmente|augmenter|monte|monter) {casa_lampe}"
          - "{casa_lampe} plus [fort]"

  LuminositeMoins:
    data:
      - sentences:
          - "(baisse|baisser|diminue|diminuer|réduis|réduire) [la] (luminosité|lumière)"
          - "moins de lumière"
          - "(éclaire|éclairer) moins"
          - "(baisse|baisser|diminue|diminuer|réduis|réduire) {casa_lampe} [la] (luminosité|lumière)"
          - "(baisse|baisser|diminue|diminuer|réduis|réduire) [la] (luminosité|lumière) (de|du|de la|des) {casa_lampe}"
          - "(baisse|baisser|diminue|diminuer|réduis|réduire) {casa_lampe}"
          - "{casa_lampe} moins [fort]"

  # Tamiser a quitté LuminositeMoins pour son propre intent : c'est le grand
  # pas, deux fois celui de « baisse ». « les lampes » a quitté le suffixe
  # facultatif, sinon la phrase aurait deux lectures.
  Tamise:
    data:
      - sentences:
          - "(tamise|tamiser) [la lumière|la pièce]"
          - "(mets|mettre) en (veilleuse|tamisé)"
          - "(tamise|tamiser) {casa_lampe}"
          - "{casa_lampe} (tamisé|tamisée|tamisés|tamisées)"
          # Dans une pièce nommée, ou partout : « tamise le salon »,
          # « tamise les lampes de la douche », « salon tamisé ».
          - "(tamise|tamiser) [les lampes|les lumières|la lumière] [de|du|de la|des|dans|dans la|dans le|au] [la|le|l'] {casa_piece}"
          - "{casa_piece} (tamisé|tamisée|tamisés|tamisées)"

  # Le geste du soir : tout ce qui est allumé descend au plancher, d'un coup,
  # sans passer par des paliers.
  TamiseBeaucoup:
    data:
      - sentences:
          - "(tamise|tamiser) (beaucoup|à fond|au maximum)"
          - "(mets|mettre) [tout] au minimum"
          - "(tamise|tamiser) {casa_lampe} (beaucoup|à fond)"
          - "{casa_lampe} [au] minimum"
          - "(tamise|tamiser) [les lampes|les lumières|la lumière] [de|du|de la|des|dans|dans la|dans le|au] [la|le|l'] {casa_piece} (beaucoup|à fond|au maximum)"
          - "(tamise|tamiser) (beaucoup|à fond) [les lampes|les lumières|la lumière] [de|du|de la|des|dans|dans la|dans le|au] [la|le|l'] {casa_piece}"

  # La luminosité d'une lampe précise, avec le verbe « mets » qui manque au
  # micro. « pourcent » reste facultatif : on le dit rarement en entier.
  LuminositeLampe:
    data:
      - sentences:
          - "(mets|mettre|passe|passer) [le|la|l'] {casa_lampe} à {casa_pourcent} [pourcent|pour cent]"
          # « bandeau cent », « lampes à cinquante pourcent ».
          - "[le|la|l'] {casa_lampe} [à] {casa_pourcent} [pourcent|pour cent]"
      # « Bandeau à fond » : cent, sans le dire. La valeur est fixée ici, et
      # arrive au script comme si elle avait été dite.
      - sentences:
          - "[le|la|l'] {casa_lampe} (à fond|au maximum|maximum|max)"
        slots:
          casa_pourcent: 100

  # « Les lampes » = les lampes de la pièce du satellite qui a entendu
  # (packages/lumieres.yaml), sans l'anneau lumineux du Voice PE que l'ordre
  # intégré emporterait avec la zone.
  #
  # Pas de « de la chambre » : dit au salon, « éteins les lampes » vise le
  # salon. Pour une AUTRE pièce, l'ordre intégré s'en charge déjà :
  # « éteins la cuisine », « allume les lumières du couloir ». Et ces phrases
  # ne mangent pas la couleur : « allume les lampes en rouge » ne correspond à
  # aucune d'elles, puisque hassil exige que la phrase entière soit couverte,
  # et part donc vers CouleurLampe.
  #
  # Les deux LED WiZ, et les tournures « allume led », sont parties avec le
  # déménagement de novembre 2026.
  # Sans pièce, celle du Voice PE qui a entendu ; celui du salon couvre
  # aussi la cuisine, ouverte sur lui (packages/lumieres.yaml).
  LampesOff:
    data:
      - sentences:
          - "(éteins|éteindre|coupe|couper) (les lampes|les lumières|la lumière|lumière|lumières|lampes)"
      # « Lampe » au singulier : dans la chambre, la lampe de chevet seule,
      # comme « éteins lampe chambre » ; ailleurs, les lampes de la pièce.
      - sentences:
          - "(éteins|éteindre|coupe|couper) [la] lampe"
        slots:
          casa_seule: "oui"

  LampesOn:
    data:
      - sentences:
          - "(allume|allumer) (les lampes|les lumières|la lumière|lumière|lumières|lampes)"
      - sentences:
          - "(allume|allumer) [la] lampe"
        slots:
          casa_seule: "oui"

  # « Allume tout » : les lampes de la pièce. Le pendant de « tout
  # éteindre », moins la musique : allumer ne relance rien. Pas l'anneau du
  # Voice PE, qui n'est pas une lampe. Le micro ne l'avait pas appris, et
  # l'ordre intégré n'y voyait aucune cible (constaté le 9 octobre 2026).
  AllumerTout:
    data:
      - sentences:
          - "(allume|allumer) tout"
          - "(allume|allumer) toutes les lampes"
          - "tout (allumé|on)"

  # La couleur avec le verbe « mets », qui manque au micro.
  #
  # Home Assistant, lui, comprend déjà « mets le bandeau en rouge ». Mais la
  # grammaire française de Speech-to-Phrase ne connaît, pour la couleur, que
  # « allume … en … » et « règle … en … » : vérifié dans son vocabulaire le
  # 23 septembre 2026. Le verbe le plus naturel était donc le seul inaudible.
  #
  # On ne redéclare pas `color` ni `name`, qui sont les listes de Home
  # Assistant : une liste du même nom les remplacerait au lieu de les
  # compléter, et rétrécirait le vocabulaire intégré. D'où des listes à nous,
  # et un intent à nous qui fait la traduction.
  #
  # `out` reste un mot FRANÇAIS, jamais un entity_id ni un nom de couleur
  # anglais : Speech-to-Phrase transcrit la valeur de sortie, et Home
  # Assistant relit cette transcription comme une phrase. « red » ne se
  # relirait pas, « rouge » oui. Même raison que pour casa_ambiance.
  CouleurLampe:
    data:
      - sentences:
          - "(mets|mettre|passe|passer) [le|la|l'] {casa_lampe} en {casa_couleur}"
          - "(mets|mettre|passe|passer) [le|la|l'] {casa_lampe} {casa_couleur}"
          # « bandeau rouge », « lampes en bleu ».
          - "[le|la|l'] {casa_lampe} [en] {casa_couleur}"

  # « Lumière 60 » : toute la pièce à ce pourcentage, sans nommer de
  # lampe. Ce qui est allumé y va ; la pièce noire, toutes ses lampes
  # s'allument à ce niveau (packages/lumieres.yaml).
  LumiereNiveau:
    data:
      - sentences:
          - "[la|les] (lumière|lumières|luminosité) [à] {casa_pourcent} [pourcent|pour cent]"
      - sentences:
          - "[la|les] (lumière|lumières|luminosité) (à fond|au maximum|maximum|max)"
        slots:
          casa_pourcent: 100

  # « Bandeau allumé », « lampes éteintes » : allumer ou éteindre une lampe
  # nommée, sans verbe. Avec un verbe, c'est l'ordre intégré qui s'en charge
  # (« allume le bandeau ») ; seule la tournure sans verbe lui manquait.
  EtatLampe:
    data:
      - sentences:
          - "[le|la|l'] {casa_lampe} {casa_etat}"

  # UNE PIÈCE NOMMÉE : « éteins lampes cuisine », « allume les lumières du
  # salon », « lampe rose chambre ». La pièce dite l'emporte sur celle du
  # satellite, et ces ordres marchent donc depuis n'importe quel Voice PE.
  #
  # Pourquoi pas l'ordre intégré, qui connaît les zones : parce que le micro
  # n'apprend que leur nom ENTIER — « Salle de bain principale » — et ni
  # « douche » ni « lampes cuisine » sans article. casa_piece porte les mots
  # qu'on dit vraiment ; packages/lumieres.yaml les traduit en zones.
  #
  # « lampe » au singulier n'entre que dans la tournure couleur-puis-pièce
  # (« lampe rose chambre ») : partout ailleurs, « lampe chambre » est la
  # lampe de chevet seule (casa_lampe), et les deux lectures se battraient.
  PieceEteindre:
    data:
      # Plusieurs pièces d'un coup, éteintes ensemble : « éteins couloir et
      # cuisine », « éteins les lampes du salon, du couloir et de la
      # cuisine ». Sans le mot « lampes », ce sont bien les lampes.
      - sentences:
          - "(éteins|éteindre|coupe|couper) [les lampes|les lumières|la lumière] [le|la|les|du|de la|des|dans|dans la|dans le|au] {casa_piece} [,] [et] [le|la|les|du|de la|des|dans|dans la|dans le|au] {casa_piece:casa_piece_2} [[,] [et] [le|la|les|du|de la|des|dans|dans la|dans le|au] {casa_piece:casa_piece_3}]"
      - sentences:
          - "(éteins|éteindre|coupe|couper) [les|la] (lampes|lumières|lumière) [de|du|de la|des|dans|dans la|dans le] {casa_piece}"
          - "[les] (lampes|lumières) [de|du|de la|dans|dans la|dans le] {casa_piece} {casa_etat_off}"
          # « Lampe » au singulier, comme on le dit : « éteins lampe salon ».
          # Pas pour la chambre, où « lampe chambre » est la lampe de chevet
          # seule (casa_lampe) : d'où casa_piece_lampe, sans elle.
          - "(éteins|éteindre|coupe|couper) [la] lampe [de|du|de la|dans|dans la|dans le] {casa_piece_lampe:casa_piece}"

  PieceAllumer:
    data:
      # Plusieurs pièces : « allume salon et couloir ».
      - sentences:
          - "(allume|allumer) [les lampes|les lumières|la lumière] [le|la|les|du|de la|des|dans|dans la|dans le|au] {casa_piece} [,] [et] [le|la|les|du|de la|des|dans|dans la|dans le|au] {casa_piece:casa_piece_2} [[,] [et] [le|la|les|du|de la|des|dans|dans la|dans le|au] {casa_piece:casa_piece_3}]"
      - sentences:
          - "(allume|allumer) [les|la] (lampes|lumières|lumière) [de|du|de la|des|dans|dans la|dans le] {casa_piece}"
          - "[les] (lampes|lumières) [de|du|de la|dans|dans la|dans le] {casa_piece} (allumées|allumé|on)"
          - "(allume|allumer) [la] lampe [de|du|de la|dans|dans la|dans le] {casa_piece_lampe:casa_piece}"
      # « Lampes salon 50 », « mets les lumières de la cuisine à 30 pourcent ».
      - sentences:
          - "[(mets|mettre|passe|passer|allume|règle)] [les] (lampes|lumières) [de|du|de la|dans|dans la|dans le] {casa_piece} [à] {casa_pourcent} [pourcent|pour cent]"

  PieceCouleur:
    data:
      - sentences:
          - "(mets|mettre|passe|passer|allume|allumer) [les|la] (lampes|lumières|lumière) [de|du|de la|dans|dans la|dans le] {casa_piece} [en] {casa_couleur}"
          - "[les] (lampes|lumières) [de|du|de la|dans|dans la|dans le] {casa_piece} [en] {casa_couleur}"
          # La couleur avant la pièce : « lampe rose chambre ».
          - "[(mets|mettre|passe|passer|allume|allumer)] [les|la] (lampe|lampes|lumière|lumières) [en] {casa_couleur} [(dans|à|de|du|de la|dans la|dans le)] [la|le] {casa_piece}"

  # « Lampe cuisine chaude », « lumières salon froides », « lampes chaudes »
  # (la pièce du satellite) : toutes au même blanc, packages/lumieres.yaml.
  PieceBlanc:
    data:
      - sentences:
          - "[(mets|mettre|passe|passer|allume|allumer)] [les|la] (lampe|lampes|lumière|lumières) [de|du|de la|des|dans|dans la|dans le] {casa_piece} [en] [blanc] {casa_blanc}"
          - "[(mets|mettre|passe|passer|allume|allumer)] [les|la] (lampe|lampes|lumière|lumières) [en] [blanc] {casa_blanc} [(dans|à|au|de|du|de la|dans la|dans le)] [la|le] {casa_piece}"
          - "[(mets|mettre|passe|passer|allume|allumer)] [les|la] (lampes|lumières|lumière) [en] [blanc] {casa_blanc}"
          - "{casa_piece} [en] [blanc] {casa_blanc}"

  # Un palier de blanc vers le chaud ou vers le froid, sur les lampes
  # allumées : « plus chaud », « lampes cuisine plus froides », « réchauffe
  # le salon ».
  PieceBlancPas:
    data:
      - sentences:
          - "[(mets|mettre|passe|passer)] [les|la] [(lampe|lampes|lumière|lumières)] [de|du|de la|des|dans|dans la|dans le] [{casa_piece}] (plus|un peu plus) {casa_sens} [[(dans|à|au|de|du|de la|dans la|dans le)] [la|le] {casa_piece}]"
      - sentences:
          - "(réchauffe|réchauffer) [les|la] [(lampe|lampes|lumière|lumières)] [(de|du|de la|des|dans|dans la|dans le|le|la)] [{casa_piece}]"
        slots:
          casa_sens: "chaud"
      - sentences:
          - "(refroidis|refroidir) [les|la] [(lampe|lampes|lumière|lumières)] [(de|du|de la|des|dans|dans la|dans le|le|la)] [{casa_piece}]"
        slots:
          casa_sens: "froid"

lists:
  # out en français, relu par Home Assistant après le micro ; la traduction
  # en zone vit dans packages/lumieres.yaml. La douche est sa propre zone
  # depuis le 17 novembre 2026 ; « bain » reste la salle de bain.
  casa_piece:
    values:
      - in: "cuisine"
        out: "cuisine"
      - in: "salon"
        out: "salon"
      - in: "chambre"
        out: "chambre"
      - in: "(salle de bain|salle de bains|bain)"
        out: "salle de bain"
      - in: "douche"
        out: "douche"
      - in: "bureau"
        out: "bureau"
      - in: "couloir"
        out: "couloir"
      # Toutes les pièces d'un coup : « éteins les lampes partout »,
      # « tamise toute la maison ». Pas une zone, packages/lumieres.yaml
      # en fait toutes les lampes.
      - in: "(partout|maison|toute la maison)"
        out: "maison"

  # casa_piece sans la chambre, pour « lampe » au singulier.
  casa_piece_lampe:
    values:
      - in: "cuisine"
        out: "cuisine"
      - in: "salon"
        out: "salon"
      - in: "(salle de bain|salle de bains|bain)"
        out: "salle de bain"
      - in: "douche"
        out: "douche"
      - in: "bureau"
        out: "bureau"
      - in: "couloir"
        out: "couloir"

  # Les six paliers du blanc, de 20 % en 20 % : chaud, doux, neutre,
  # clair, frais, froid (packages/lumieres.yaml).
  casa_blanc:
    values:
      - in: "(chaud|chaude|chauds|chaudes)"
        out: "chaud"
      - in: "(doux|douce|douces)"
        out: "doux"
      - in: "(neutre|neutres)"
        out: "neutre"
      - in: "(clair|claire|clairs|claires)"
        out: "clair"
      - in: "(frais|fraîche|fraîches|fraiche|fraiches)"
        out: "frais"
      - in: "(froid|froide|froids|froides)"
        out: "froid"

  casa_sens:
    values:
      - in: "(chaud|chaude|chauds|chaudes)"
        out: "chaud"
      - in: "(froid|froide|froids|froides)"
        out: "froid"

  casa_etat_off:
    values:
      - in: "(éteintes|éteint|éteints|off)"
        out: "éteint"

  casa_lampe:
    values:
      - in: "(bandeau|flux gradient|gradient)"
        out: "bandeau"
      - in: "(lampe chambre|lampe de la chambre)"
        out: "lampe chambre"
      # Les lampes de la pièce du satellite, pour « mets les lampes en
      # rouge ».
      - in: "(les lampes|lampes)"
        out: "les lampes"
  # Les pourcentages dicibles. Par pas de 5, comme la liste de Home
  # Assistant : à l'oral on ne demande pas 43 %. Elle commence à 5, donc
  # « mets bandeau à zéro » n'existe pas — on éteint, on ne met pas à zéro.
  casa_pourcent:
    range:
      type: number
      from: 5
      to: 100
      step: 5

  # out en français, comme casa_couleur : Speech-to-Phrase transcrit la
  # valeur de sortie, et Home Assistant la relit comme une phrase.
  casa_etat:
    values:
      - in: "(allumé|allumée|allumés|allumées|on)"
        out: "allumé"
      - in: "(éteint|éteinte|éteints|éteintes|off)"
        out: "éteint"

  casa_couleur:
    values:
      - in: "rouge"
        out: "rouge"
      - in: "bleu"
        out: "bleu"
      - in: "vert"
        out: "vert"
      - in: "violet"
        out: "violet"
      - in: "orange"
        out: "orange"
      - in: "jaune"
        out: "jaune"
      - in: "rose"
        out: "rose"
      - in: "blanc"
        out: "blanc"
