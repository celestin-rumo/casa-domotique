# La chambre : l'aération. Les intents sont traités par intent_script dans
# packages/chambre.yaml. Sa température se demande comme celle des autres
# pièces (TemperaturePiece, meteo.yaml).
language: "fr"

intents:
  Aerer:
    data:
      - sentences:
          - "(j'aère|j'ouvre la fenêtre|aère|aération) [pendant] [{aeration_minutes} minutes]"
          - "(rappelle-moi|rappelle moi) de fermer la fenêtre [dans {aeration_minutes} minutes]"

  FenetreFermee:
    data:
      - sentences:
          - "(j'ai fermé|j'ai refermé) la fenêtre"
          - "fenêtre fermée"

lists:
  aeration_minutes:
    range:
      type: number
      from: 5
      to: 30
      step: 5
