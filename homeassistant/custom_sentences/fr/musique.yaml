# Commander la musique à la voix. Les intents sont traités par intent_script
# dans packages/musique.yaml.
#
# POURQUOI CE FICHIER EXISTE. Home Assistant, lui, comprend déjà « éteins la
# musique » : il en fait un HassMediaPause. Mais Speech-to-Phrase ne
# transcrit que ce qu'il a appris, et son vocabulaire français ne connaît,
# pour arrêter la lecture, que :
#
#     pause
#     arrête[r] la musique
#     arrête[r] la musique dans|de la <pièce>
#     (mets|mettre) <lecteur> (en|sur) pause
#
# « éteins la musique » n'y est pas. Le satellite ne renvoie alors AUCUN
# texte — dans le journal des échanges, `stt-no-text-recognized` — et Home
# Assistant n'a jamais l'occasion de comprendre. Constaté le 22 septembre
# 2026 sur le Voice PE.
#
# On y ajoute d'abord les tournures qui MANQUENT au micro. « arrête la
# musique » y est aussi depuis le 7 octobre 2026, avec « arrête musique »,
# sans article, que le micro ne connaissait pas : deux intents sont alors
# candidats, et c'est celui du dépôt qui gagne — constaté sur le Pi pour
# « éteins la musique ». L'effet est le même, une pause. « pause » seul
# reste au moteur intégré.
language: "fr"

intents:
  ArreterMusique:
    data:
      - sentences:
          - "(éteins|éteindre|coupe|couper) la musique"
          - "(stop|stoppe|stopper) [la] musique"
          - "(arrête|arrêter|arrete) [la] musique"
          - "(éteins|coupe) le son"
          - "plus de musique"
          # Sans verbe.
          - "[la] musique (stop|off|coupée)"
          - "pas de musique"

  ReprendreMusique:
    data:
      - sentences:
          - "(remets|remettre|relance|relancer|rallume) la musique"
          - "(remets|relance) le son"
          - "continue la musique"
          - "[la] musique (on|play|encore)"
          - "(lance|lancer|joue|play) [la] musique"

  MusiqueSuivante:
    data:
      - sentences:
          - "(chanson|morceau|titre) suivant[e]"
          - "(passe|passer) (au suivant|à la suivante)"
          - "(passe|change) de (chanson|morceau|titre)"
          - "suivant[e]"
          - "(chanson|morceau|titre) d'après"
