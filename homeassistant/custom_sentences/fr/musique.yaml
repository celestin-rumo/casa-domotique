# Commander la musique à la voix. Les intents sont traités par intent_script
# dans packages/musique.yaml.
#
# POURQUOI CE FICHIER EXISTE. Home Assistant, lui, comprend déjà « éteins la
# musique » : il en fait un HassMediaPause. Mais Speech-to-Phrase ne
# transcrit que ce qu'il a appris, et son vocabulaire français ne connaît,
# pour arrêter la lecture, que :
#
#     pause
#     arrête[r] la musique
#     arrête[r] la musique dans|de la <pièce>
#     (mets|mettre) <lecteur> (en|sur) pause
#
# « éteins la musique » n'y est pas. Le satellite ne renvoie alors AUCUN
# texte — dans le journal des échanges, `stt-no-text-recognized` — et Home
# Assistant n'a jamais l'occasion de comprendre. Constaté le 22 septembre
# 2026 sur le Voice PE.
#
# On y ajoute d'abord les tournures qui MANQUENT au micro. « arrête la
# musique » y est aussi depuis le 7 octobre 2026, avec « arrête musique »,
# sans article, que le micro ne connaissait pas : deux intents sont alors
# candidats, et c'est celui du dépôt qui gagne — constaté sur le Pi pour
# « éteins la musique ». L'effet est le même, une pause. « pause » seul
# reste au moteur intégré.
# UNE PIÈCE PEUT SUIVRE chaque ordre : « arrête la musique au salon »,
# « remets la musique dans la chambre », « coupe la musique partout ». Sans
# elle, c'est l'enceinte de la pièce du satellite (packages/musique.yaml).
# casa_piece est la liste de custom_sentences/fr/lumieres.yaml.
language: "fr"

intents:
  ArreterMusique:
    data:
      - sentences:
          - "(éteins|éteindre|coupe|couper) la musique [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(stop|stoppe|stopper) [la] musique [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(arrête|arrêter|arrete) [la] musique [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(éteins|coupe) le son [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "plus de musique [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          # Sans verbe.
          - "[la] musique (stop|off|coupée) [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "pas de musique [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"

  ReprendreMusique:
    data:
      - sentences:
          - "(remets|remettre|relance|relancer|rallume) la musique [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(remets|relance) le son [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "continue la musique [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "[la] musique (on|play|encore) [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(lance|lancer|joue|play) [la] musique [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"

  MusiqueSuivante:
    data:
      - sentences:
          - "(chanson|morceau|titre) suivant[e] [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(passe|passer) (au suivant|à la suivante) [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(passe|change) de (chanson|morceau|titre) [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "suivant[e] [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"
          - "(chanson|morceau|titre) d'après [[(dans|à|au|de|du)] [la|le|l'] {casa_piece}]"

  # « Qu'est-ce qui joue ? » : le titre et l'artiste, packages/musique.yaml.
  QuiJoue:
    data:
      - sentences:
          - "(qu'est-ce qui|qu'est ce qui|c'est quoi qui) (joue|passe)"
          - "c'est quoi (cette|la) (chanson|musique)"
          - "(quelle est cette|c'est quelle) (chanson|musique)"
          - "(quel|c'est quel) (morceau|titre)"
          - "c'est qui (qui chante|l'artiste)"

