# Le bouton lançait l'ambiance Cinéma ; sans TV et avec la seule chambre
# équipée, il lance Détente — l'ambiance par défaut de la pièce. Il
# reprendra Cinéma quand la TV sera là.
- id: bouton_mural_detente
  alias: Bouton mural → Détente
  trigger:
    - platform: device
      domain: zha
      type: remote_button_short_press
      subtype: turn_on
      device_id: REMPLACER_PAR_ID_DU_BOUTON
  action:
    - service: script.mood_detente
