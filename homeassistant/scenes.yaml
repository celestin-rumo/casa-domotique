# Paramètres → Automatisations et scènes → Scènes crée ces entrées automatiquement.
# Exemple manuel :
#
# UNE SEULE PIÈCE : LA CHAMBRE. C'est le seul endroit équipé aujourd'hui, et
# tout le dépôt est écrit comme s'il n'y en avait pas d'autre. Le salon, la
# cuisine et la scène Cinéma reviendront avec les ampoules et la TV — la
# version multi-pièces est dans l'historique git, commit ccb9f08 et avant
# (docs/TESTING.md, « Une seule pièce, la chambre »).
#
# La chambre reprend donc le rôle que le salon tenait : c'est elle qui porte
# Détente et Focus, et non plus seulement les ambiances de fin de journée.
- id: detente
  name: Détente
  entities:
    light.chambre: { state: "on", brightness: 90, color_temp_kelvin: 2400 }
- id: focus
  name: Focus
  entities:
    light.chambre: { state: "on", brightness: 210, color_temp_kelvin: 4200 }
- id: chillos
  name: Chillos
  entities:
    light.chambre: { state: "on", brightness: 8, color_temp_kelvin: 2200 }
# Pourpre et bas.
- id: calin
  name: Câlin
  entities:
    light.chambre: { state: "on", brightness: 30, rgb_color: [130, 0, 150] }
- id: tout_eteindre
  name: Tout éteindre
  entities:
    light.chambre: { state: "off" }
