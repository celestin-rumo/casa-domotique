# Paramètres → Automatisations et scènes → Scènes crée ces entrées automatiquement.
# Exemple manuel :
- id: cinema
  name: Cinéma
  entities:
    light.salon: { state: "on", brightness: 15, rgb_color: [120, 20, 20] }
    light.cuisine: { state: "off" }
    media_player.lg_tv: { state: "on" }
- id: detente
  name: Détente
  entities:
    light.salon: { state: "on", brightness: 90, color_temp_kelvin: 2400 }
    light.cuisine: { state: "on", brightness: 60, color_temp_kelvin: 2400 }
- id: focus
  name: Focus
  entities:
    light.salon: { state: "on", brightness: 210, color_temp_kelvin: 4200 }
    light.cuisine: { state: "off" }
    light.chambre: { state: "off" }
- id: chillos
  name: Chillos
  entities:
    light.salon: { state: "on", brightness: 12, color_temp_kelvin: 2200 }
    light.cuisine: { state: "off" }
    light.chambre: { state: "on", brightness: 8, color_temp_kelvin: 2200 }
# Rouge et pourpre, bas : le salon tire sur le rouge, la chambre sur le
# violet. La cuisine n'a rien à faire là.
- id: calin
  name: Câlin
  entities:
    light.salon: { state: "on", brightness: 40, rgb_color: [190, 20, 80] }
    light.cuisine: { state: "off" }
    light.chambre: { state: "on", brightness: 30, rgb_color: [130, 0, 150] }
- id: tout_eteindre
  name: Tout éteindre
  entities:
    light.salon: { state: "off" }
    light.cuisine: { state: "off" }
    light.chambre: { state: "off" }
