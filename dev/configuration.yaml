# Home Assistant de développement. Ce fichier n'existe que pour le poste de
# dev : sur le Pi, c'est homeassistant/configuration.yaml qui sert.
#
# Il inclut les vrais fichiers du dépôt, montés sur /config/casa, et ajoute
# quatre fausses ampoules — celles de la chambre — pour que light.chambre et
# les autres existent sans qu'aucune ampoule soit branchée.
default_config:

# Pas de bloc « http: » ici, pour deux raisons.
#
# 1. L'app n'en a presque pas besoin. src/ha.ts parle à Home Assistant par
#    WebSocket, et un navigateur n'applique pas le CORS aux WebSockets.
#    createLongLivedTokenAuth ne fait aucune requête HTTP : le jeton part
#    dans le message d'authentification, pas dans un appel REST.
#
#    Une exception, et une seule : enregistrer une ambiance depuis l'app
#    (Ambiances → Ajuster) passe par /api/config/scene/config/<id> — une
#    lecture, puis une écriture — parce que Home Assistant n'expose pas
#    l'écriture des scènes par WebSocket. Ici, l'app tourne sur
#    localhost:5173 et Home Assistant sur :8123 — deux origines, donc le
#    CORS s'applique à ces deux requêtes-là.
#    Sans rien déclarer, le bouton répond « origine refusée », et tout le
#    reste de l'app marche normalement.
#
# 2. Depuis HA 2026.x, « http: » en YAML est déprécié (retiré en 2027.2). Le
#    bloc est importé une fois dans .storage/, à l'essai : sans confirmation
#    dans l'interface sous cinq minutes, Home Assistant revient à sa
#    configuration précédente ET REDÉMARRE — un redémarrage surprise au
#    milieu de la première prise en main. Ensuite le YAML est ignoré pour
#    toujours, en silence.
#
# Pour que l'enregistrement d'une ambiance marche aussi en dev, déclarer
# l'origine de l'app dans Paramètres → Système → Réseau — jamais ici.

# --- les fichiers du dépôt, tels quels ---
# Les packages (le réveil, la météo) : leurs input_boolean se fusionnent avec
# ceux des fausses ampoules ci-dessous, et leurs automatisations se chargent
# ici comme sur le Pi.
homeassistant:
  packages: !include_dir_named casa/packages
  # Speech-to-Phrase s'entraîne dans la langue du système et celles des
  # assistants vocaux. Un Home Assistant créé en anglais au premier écran
  # n'apprendrait que l'anglais ; en dev, on tranche ici. Sur le Pi, c'est
  # le premier écran qui décide, et il est en français.
  language: fr
  country: CH

input_select: !include casa/input_selects.yaml
script: !include casa/scripts.yaml

# Les scènes appartiennent à Home Assistant, pas au dépôt : `scenes.yaml`
# sans préfixe, donc son fichier à lui, éditable depuis l'interface. Même
# raison que sur le Pi (pi/configuration.yaml). `casa/scenes.yaml` est la
# graine, à recopier une fois dans /config.
scene: !include scenes.yaml
# Pas d'`automation:` : le dépôt n'a pas d'automations.yaml. Les seules
# automatisations sont celles des packages, chargées ci-dessus.

# --- de quoi porter l'état des quatre lumières qui n'existent pas ---
# Quatre, comme dans la chambre : la lampe, le bandeau et les deux WiZ.
input_boolean:
  chambre_on:
    name: Chambre allumée
  chambre_bandeau_on:
    name: Bandeau allumé
  chambre_wiz_1_on:
    name: WiZ 1 allumée
  chambre_wiz_2_on:
    name: WiZ 2 allumée

input_number:
  chambre_niveau:
    name: Chambre niveau
    min: 0
    max: 255
    initial: 120
  chambre_bandeau_niveau:
    name: Bandeau niveau
    min: 0
    max: 255
    initial: 60
  chambre_wiz_1_niveau:
    name: WiZ 1 niveau
    min: 0
    max: 255
    initial: 80
  chambre_wiz_2_niveau:
    name: WiZ 2 niveau
    min: 0
    max: 255
    initial: 80
  # Le faux capteur de la pièce : à bouger dans l'interface pour voir la
  # carte Climat de l'app suivre.
  temperature_interieure:
    name: Température intérieure (simulée)
    min: 10
    max: 35
    step: 0.1
    initial: 21.5
  humidite_interieure:
    name: Humidité intérieure (simulée)
    min: 0
    max: 100
    initial: 48

# --- light.chambre, light.chambre_bandeau et les deux WiZ : allumage et intensité ---
# Les `initial:` des helpers ci-dessus sont voulus ici, et seulement ici :
# de fausses ampoules qui repartent des mêmes valeurs à chaque démarrage
# font un banc d'essai reproductible. Le réveil, lui, n'en a aucun
# (packages/reveil.yaml dit pourquoi).
# Les entités template vivent sous la clé « template: ». L'ancienne forme,
# « light: - platform: template », n'est plus acceptée depuis HA 2026.x : elle
# ne fait pas échouer le démarrage, elle laisse une ligne d'erreur dans les
# logs et l'ampoule n'existe tout simplement pas. C'est le cas que
# l'étape 1.2 de docs/TESTING.md sert à attraper.
#
# Le nom donne l'entity_id : « Chambre » → light.chambre, « Chambre bandeau »
# → light.chambre_bandeau.
#
# set_level rallume AUSSI le booléen, et ce n'est pas une redondance : quand
# light.turn_on reçoit une luminosité, Home Assistant exécute set_level à la
# place de turn_on, jamais les deux. Sans cette seconde ligne, le niveau monte
# et l'ampoule reste éteinte — or toutes les scènes précisent une luminosité,
# donc aucune ambiance n'allumerait quoi que ce soit.
#
# La couleur n'est pas simulée : les scènes en demandent, mais seuls
# l'allumage et l'intensité se vérifient ici. Le rendu couleur est de toute
# façon une affaire d'étape 3, où on regarde la pièce plutôt que l'écran.
template:
  # sensor.temperature_interieure et sensor.humidite_interieure : sur le Pi,
  # c'est le capteur Zigbee renommé ainsi (docs/TESTING.md, 3.2). Ici, deux
  # nombres qu'on règle à la main.
  - sensor:
      - name: Température intérieure
        unique_id: casa_dev_temperature_interieure
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ states('input_number.temperature_interieure') }}"
      - name: Humidité intérieure
        unique_id: casa_dev_humidite_interieure
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: "{{ states('input_number.humidite_interieure') }}"
  - light:
      - name: Chambre
        unique_id: casa_dev_chambre
        state: "{{ is_state('input_boolean.chambre_on', 'on') }}"
        level: "{{ states('input_number.chambre_niveau') | int(0) }}"
        turn_on:
          action: input_boolean.turn_on
          target: { entity_id: input_boolean.chambre_on }
        turn_off:
          action: input_boolean.turn_off
          target: { entity_id: input_boolean.chambre_on }
        set_level:
          - action: input_number.set_value
            target: { entity_id: input_number.chambre_niveau }
            data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.chambre_on }

      - name: Chambre bandeau
        unique_id: casa_dev_chambre_bandeau
        state: "{{ is_state('input_boolean.chambre_bandeau_on', 'on') }}"
        level: "{{ states('input_number.chambre_bandeau_niveau') | int(0) }}"
        turn_on:
          action: input_boolean.turn_on
          target: { entity_id: input_boolean.chambre_bandeau_on }
        turn_off:
          action: input_boolean.turn_off
          target: { entity_id: input_boolean.chambre_bandeau_on }
        set_level:
          - action: input_number.set_value
            target: { entity_id: input_number.chambre_bandeau_niveau }
            data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.chambre_bandeau_on }

      - name: Chambre WiZ 1
        unique_id: casa_dev_chambre_wiz_1
        state: "{{ is_state('input_boolean.chambre_wiz_1_on', 'on') }}"
        level: "{{ states('input_number.chambre_wiz_1_niveau') | int(0) }}"
        turn_on:
          action: input_boolean.turn_on
          target: { entity_id: input_boolean.chambre_wiz_1_on }
        turn_off:
          action: input_boolean.turn_off
          target: { entity_id: input_boolean.chambre_wiz_1_on }
        set_level:
          - action: input_number.set_value
            target: { entity_id: input_number.chambre_wiz_1_niveau }
            data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.chambre_wiz_1_on }

      - name: Chambre WiZ 2
        unique_id: casa_dev_chambre_wiz_2
        state: "{{ is_state('input_boolean.chambre_wiz_2_on', 'on') }}"
        level: "{{ states('input_number.chambre_wiz_2_niveau') | int(0) }}"
        turn_on:
          action: input_boolean.turn_on
          target: { entity_id: input_boolean.chambre_wiz_2_on }
        turn_off:
          action: input_boolean.turn_off
          target: { entity_id: input_boolean.chambre_wiz_2_on }
        set_level:
          - action: input_number.set_value
            target: { entity_id: input_number.chambre_wiz_2_niveau }
            data: { value: "{{ brightness }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.chambre_wiz_2_on }
