# Home Assistant du Raspberry Pi, avec du vrai matériel.
#
# Même forme que dev/configuration.yaml — il inclut les fichiers du dépôt
# montés en lecture seule sur /config/casa — mais sans aucune fausse
# entité : ici, light.chambre est une ampoule Hue, et sensor.temperature_interieure
# le Sonoff SNZB-02P.
#
# Le dépôt n'est jamais écrit par Home Assistant : sa base, ses journaux et
# son .storage/ vont dans un volume Docker, comme sur le poste de dev.

default_config:

# Pas de bloc « http: ». L'app parle par WebSocket, où le CORS ne s'applique
# pas — sauf l'enregistrement d'une ambiance, qui passe par l'API REST. Servie par Home Assistant depuis /local/casa/, elle est sur la
# même origine et rien n'est à régler. « http: » en YAML est de toute façon
# déprécié depuis HA 2026.x (retiré en 2027.2), et s'auto-révoque avec un
# redémarrage surprise s'il n'est pas confirmé dans l'interface en cinq
# minutes. Le réglage vit dans Paramètres → Système → Réseau.

homeassistant:
  # Un « package » par fonction transverse : le réveil et la météo portent
  # chacun ses helpers, ses scripts et ses réponses vocales ensemble.
  packages: !include_dir_named casa/packages

  # Écrit ici plutôt que laissé au premier écran, parce qu'une langue
  # choisie de travers ne se voit pas : Speech-to-Phrase s'entraîne dans la
  # langue du système, et n'apprendrait que l'anglais sans rien dire.
  language: fr
  country: CH
  time_zone: Europe/Zurich

# --- les fichiers du dépôt, tels quels ---
input_select: !include casa/input_selects.yaml
script: !include casa/scripts.yaml

# --- les scènes, elles, appartiennent à Home Assistant ---
# `scenes.yaml` sans préfixe : le fichier de Home Assistant, pas celui du
# dépôt. C'est ce qui rend l'éditeur de l'interface utilisable — roue
# chromatique comprise — parce qu'il ne sait écrire que dans un fichier
# qu'il possède.
#
# Le partage est délibéré. Les scènes sont du goût : on les retouche à l'œil,
# dans la pièce, souvent. Les faire passer par un commit et un `git pull` à
# chaque essai serait absurde. Les scripts, eux, sont de la logique — l'ordre
# des étapes, l'écho qui confirme, l'ancre YAML partagée entre les ambiances —
# et l'éditeur de l'interface détruirait cette ancre en réécrivant le fichier.
#
# `casa/scenes.yaml` reste dans le dépôt comme **graine**, à recopier une fois
# (TESTING.md 2.2). Pour figer une ambiance qui te satisfait durablement, la
# recopier en sens inverse et la committer.
scene: !include scenes.yaml

# --- les automatisations créées à la souris ---
# L'éditeur de Home Assistant les écrit dans /config/automations.yaml, et
# Home Assistant ne les CHARGE que par cet include. Ce fichier-ci disait
# autrefois qu'elles vivaient dans .storage/ et n'en demandaient aucun :
# c'était faux. Recopié sur le Pi le 17 novembre 2026, il a fait disparaître
# en silence les automatisations du salon et du variateur Hue, restées
# « injoignables » — le fichier intact, simplement plus lu.
#
# Même partage que les scènes : `automations.yaml` sans préfixe est le
# fichier de Home Assistant, pas du dépôt. Celles du dépôt (réveil, météo,
# aération, plafond du son) arrivent par `packages:`, et les deux listes
# se fusionnent.
automation: !include automations.yaml
